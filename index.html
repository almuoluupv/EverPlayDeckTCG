function getVideoSourceRect(video){
  const vw=video.videoWidth,vh=video.videoHeight;
  const ew=video.clientWidth,eh=video.clientHeight;
  const baseScale=Math.max(ew/vw,eh/vh);
  // Si el navegador no ofrece zoom real, el vídeo se amplía con CSS.
  // La captura debe usar exactamente la misma transformación para que el
  // recuadro que ve el usuario corresponda al píxel que recibe el OCR.
  const digitalZoom=state.scan.hardwareZoom?1:Math.max(1,Number(state.scan.zoom)||1);
  const scale=baseScale*digitalZoom;
  const rw=vw*scale,rh=vh*scale;
  return {left:(ew-rw)/2,top:(eh-rh)/2,width:rw,height:rh};
}

function preprocessForOCR(srcCanvas){
  const sw=srcCanvas.width, sh=srcCanvas.height;
  const dst=document.createElement('canvas'); dst.width=sw; dst.height=sh;
  const ctx=dst.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(srcCanvas,0,0);
  const imgData=ctx.getImageData(0,0,sw,sh); const d=imgData.data;

  // 1. Escala de grises perceptual
  const gray=new Uint8Array(sw*sh);
  for(let i=0,p=0;i<d.length;i+=4,p++)
    gray[p]=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);

  // 2. Unsharp mask 3×3 — realza bordes del texto
  const blur=new Uint8Array(sw*sh);
  for(let y=0;y<sh;y++) for(let x=0;x<sw;x++){
    let s=0,w=0;
    for(let ky=-1;ky<=1;ky++) for(let kx=-1;kx<=1;kx++){
      const nx=x+kx,ny=y+ky;
      if(nx>=0&&nx<sw&&ny>=0&&ny<sh){
        const wt=[1,2,1,2,4,2,1,2,1][(ky+1)*3+(kx+1)]; s+=gray[ny*sw+nx]*wt; w+=wt;
      }
    }
    blur[y*sw+x]=Math.round(s/w);
  }
  const sharp=new Uint8Array(sw*sh);
  for(let i=0;i<gray.length;i++)
    sharp[i]=Math.max(0,Math.min(255,Math.round(gray[i]+2.0*(gray[i]-blur[i]))));

  // 3. Detectar si el texto es oscuro-sobre-claro o claro-sobre-oscuro
  //    Calculamos la media de la zona central: si es >128 el fondo es claro
  let sum=0, cnt=0;
  const mx=Math.floor(sw*0.1), my=Math.floor(sh*0.1);
  const mw=sw-2*mx, mh=sh-2*my;
  for(let y=my;y<my+mh;y++) for(let x=mx;x<mx+mw;x++){sum+=sharp[y*sw+x];cnt++;}
  const mean=sum/cnt;
  // Si fondo claro (media>140) los dígitos son oscuros → binarizar normal
  // Si fondo oscuro (media<115) los dígitos son claros → invertir resultado
  const darkOnLight = mean > 128;

  // 4. Binarización adaptativa (ventana 25px)
  const R=12;
  const integ=new Float64Array((sw+1)*(sh+1));
  for(let y=0;y<sh;y++) for(let x=0;x<sw;x++){
    integ[(y+1)*(sw+1)+(x+1)]=sharp[y*sw+x]
      +integ[y*(sw+1)+(x+1)]+integ[(y+1)*(sw+1)+x]-integ[y*(sw+1)+x];
  }
  const out=new Uint8Array(sw*sh);
  for(let y=0;y<sh;y++) for(let x=0;x<sw;x++){
    const x1=Math.max(0,x-R),y1=Math.max(0,y-R),x2=Math.min(sw-1,x+R),y2=Math.min(sh-1,y+R);
    const area=(x2-x1+1)*(y2-y1+1);
    const s=integ[(y2+1)*(sw+1)+(x2+1)]-integ[y1*(sw+1)+(x2+1)]
            -integ[(y2+1)*(sw+1)+x1]+integ[y1*(sw+1)+x1];
    const localMean=s/area;
    // pixel es texto si está suficientemente por debajo (oscuro) o encima (claro) del fondo local
    const isText = darkOnLight ? sharp[y*sw+x] < localMean - 8
                                : sharp[y*sw+x] > localMean + 8;
    out[y*sw+x] = isText ? 0 : 255;  // negro=texto, blanco=fondo para Tesseract
  }

  // 5. Escribir resultado en el canvas destino
  const od=ctx.createImageData(sw,sh);
  for(let i=0,p=0;i<od.data.length;i+=4,p++){
    od.data[i]=od.data[i+1]=od.data[i+2]=out[p]; od.data[i+3]=255;
  }
  ctx.putImageData(od,0,0);
  return dst;
}


function captureRoiCanvas(video, roi){
  if(!roi) roi=state.scan.roi;
  const vw=video.videoWidth,vh=video.videoHeight;
  const display=getVideoSourceRect(video);
  const box={x:roi.x*video.clientWidth,y:roi.y*video.clientHeight,w:roi.w*video.clientWidth,h:roi.h*video.clientHeight};
  const ix=Math.max(box.x,display.left),iy=Math.max(box.y,display.top);
  const ax=Math.min(box.x+box.w,display.left+display.width),ay=Math.min(box.y+box.h,display.top+display.height);
  const sx=Math.max(0,Math.round((ix-display.left)/display.width*vw));
  const sy=Math.max(0,Math.round((iy-display.top)/display.height*vh));
  const sw=Math.max(1,Math.min(vw-sx,Math.round((ax-ix)/display.width*vw)));
  const sh=Math.max(1,Math.min(vh-sy,Math.round((ay-iy)/display.height*vh)));
  // Escalar al menos 4× para dar píxeles suficientes al OCR en zonas pequeñas
  const scale=Math.max(4,Math.min(8,3600/Math.max(sw,sh)));
  const raw=document.createElement('canvas'); raw.width=Math.round(sw*scale); raw.height=Math.round(sh*scale);
  const rctx=raw.getContext('2d',{willReadFrequently:true});
  rctx.imageSmoothingEnabled=true; rctx.imageSmoothingQuality='high';
  rctx.drawImage(video,sx,sy,sw,sh,0,0,raw.width,raw.height);
  return preprocessForOCR(raw);
}

/* ocrCanvas — configurable por psm y whitelist */
async function ocrCanvas(canvas, { psmMode='6', whitelist=null } = {}){
  if(!ocrWorker || !canvas?.width || !canvas?.height) return '';
  const image = canvas.toDataURL('image/png');
  const params = { tessedit_pageseg_mode: psmMode, user_defined_dpi: '400' };
  if(whitelist) params.tessedit_char_whitelist = whitelist;
  else delete params.tessedit_char_whitelist;
  await ocrWorker.setParameters(params);
  const result = await ocrWorker.recognize(image);
  return result?.data?.text || '';
}

/* canvasGrayscaleOnly — devuelve el canvas en escala de grises SIN binarizar,
   útil como segunda pasada cuando la binarización destruye el contraste */
function canvasGrayscaleOnly(srcCanvas){
  const sw=srcCanvas.width, sh=srcCanvas.height;
  const dst=document.createElement('canvas'); dst.width=sw; dst.height=sh;
  const ctx=dst.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(srcCanvas,0,0);
  const id=ctx.getImageData(0,0,sw,sh); const d=id.data;
  for(let i=0;i<d.length;i+=4){
    const g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
    // Boost contraste suave (no binarizar): mapear 0-255 → expandir rango
    const v=Math.max(0,Math.min(255,Math.round((g-80)*1.8)));
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(id,0,0);
  return dst;
}

/* captureRawCanvas — captura el ROI en gris SIN preprocessForOCR */
function captureRawCanvas(video, roi){
  if(!roi) roi=state.scan.roi;
  const vw=video.videoWidth, vh=video.videoHeight;
  const display=getVideoSourceRect(video);
  const box={x:roi.x*video.clientWidth,y:roi.y*video.clientHeight,w:roi.w*video.clientWidth,h:roi.h*video.clientHeight};
  const ix=Math.max(box.x,display.left), iy=Math.max(box.y,display.top);
  const ax=Math.min(box.x+box.w,display.left+display.width), ay=Math.min(box.y+box.h,display.top+display.height);
  const sx=Math.max(0,Math.round((ix-display.left)/display.width*vw));
  const sy=Math.max(0,Math.round((iy-display.top)/display.height*vh));
  const sw=Math.max(1,Math.min(vw-sx,Math.round((ax-ix)/display.width*vw)));
  const sh=Math.max(1,Math.min(vh-sy,Math.round((ay-iy)/display.height*vh)));
  const scale=Math.max(4,Math.min(8,3600/Math.max(sw,sh)));
  const raw=document.createElement('canvas'); raw.width=Math.round(sw*scale); raw.height=Math.round(sh*scale);
  const rctx=raw.getContext('2d',{willReadFrequently:true});
  rctx.imageSmoothingEnabled=true; rctx.imageSmoothingQuality='high';
  rctx.drawImage(video,sx,sy,sw,sh,0,0,raw.width,raw.height);
  return canvasGrayscaleOnly(raw);
}

/* captureAndRecognize — 4 estrategias OCR sobre la zona número, voto por mayoría */
async function captureAndRecognize(){
  if(liveBusy) return;
  const video = document.getElementById('liveVideo');
  if(!video || video.readyState<2 || !video.videoWidth || !video.videoHeight || !ocrWorker){
    state.scan.liveMessage='📷 Cámara no lista. Espera un instante.'; render(); return;
  }
  liveBusy = true; state.scan.liveError = ''; state.scan.suggestions = [];
  const statusEl = document.getElementById('liveStatusText');

  try{
    // ── ZONA NÚMERO: 4 estrategias OCR ────────────────────────────────────────
    // El texto en la carta es: "G PAR en 128/182 ♦"
    // Estrategia A: binarizado + psm 6 (bloque) sin whitelist — detecta la línea entera
    // Estrategia B: gris puro + psm 6 sin whitelist — por si binarización arruina contraste
    // Estrategia C: binarizado + psm 11 (sparse) — recoge números sueltos en cualquier posición
    // Estrategia D: gris puro + psm 11 — fallback definitivo
    if(statusEl) statusEl.textContent = '📸 Analizando número (A)…';
    const numRoi = state.scan.roiNum;
    const cBin = captureRoiCanvas(video, numRoi);    // binarizado
    const cRaw = captureRawCanvas(video, numRoi);    // gris puro

    const [textA, textB, textC, textD] = await Promise.all([
      ocrCanvas(cBin, { psmMode:'6' }),   // A: bin + bloque
      ocrCanvas(cRaw, { psmMode:'6' }),   // B: raw + bloque
      ocrCanvas(cBin, { psmMode:'11' }),  // C: bin + sparse
      ocrCanvas(cRaw, { psmMode:'11' }),  // D: raw + sparse
    ]);

    // Votar la fracción más repetida entre las 4 estrategias
    const fracCount = {};
    for(const t of [textA, textB, textC, textD]){
      for(const f of extractNumberFraction(t)){
        const k = f.number+'/'+f.total;
        fracCount[k] = (fracCount[k]||0)+1;
      }
    }
    let bestFrac='', bestVotes=0;
    for(const [k,v] of Object.entries(fracCount)){
      if(v>bestVotes){ bestVotes=v; bestFrac=k; }
    }

    // Extraer código de set de todos los textos combinados
    const allNumText = [textA,textB,textC,textD].join('\n');
    const detectedSetId = extractSetCode(allNumText);

    // ── ZONA CARTA: franja superior (15%) para el nombre ──────────────────────
    if(statusEl) statusEl.textContent = '📸 Leyendo nombre…';
    const roi = state.scan.roi;
    // Solo la franja superior donde está el nombre — evita contaminar con ataques
    const nameRoi = { x: roi.x, y: roi.y, w: roi.w, h: roi.h * 0.15 };
    const nameCanvasBin = captureRoiCanvas(video, nameRoi);
    const nameCanvasRaw = captureRawCanvas(video, nameRoi);
    // Dos pasadas también para el nombre
    const [nameA, nameB] = await Promise.all([
      ocrCanvas(nameCanvasBin, { psmMode:'7' }),
      ocrCanvas(nameCanvasRaw, { psmMode:'7' }),
    ]);
    // Elegir el resultado de nombre más largo (más información)
    const nameText = nameA.length >= nameB.length ? nameA : nameB;

    // Debug legible
    const nameLine = nameText.replace(/[^A-Za-z\u00C0-\u00FF' \-]/g,'').trim();
    state.scan.liveText = [
      bestFrac ? `Núm: ${bestFrac} (${bestVotes}/4)` : 'Núm: no detectado',
      detectedSetId ? `Set: ${detectedSetId}` : '',
      nameLine.length>1 ? `Nombre: ${nameLine.slice(0,25)}` : ''
    ].filter(Boolean).join(' · ');
    render();

    // ── Señal de color + pHash visual (paralelos, no bloquean el OCR) ─────────
    let typeScores = {};
    let colorHint = '';
    let phashResults = [];
    try {
      const r = state.scan.roi;

      // Color: zona superior-izq donde está el símbolo de tipo
      const typeRoi = { x: r.x, y: r.y, w: r.w * 0.22, h: r.h * 0.38 };
      const typeCanvas = captureRoiCanvas(video, typeRoi);
      const { hue, confidence } = dominantHueFromCanvas(typeCanvas);
      typeScores = hueToTypeScores(hue, confidence);
      if(confidence > 0.25){
        const top = Object.entries(typeScores).sort((a,b)=>b[1]-a[1])[0];
        if(top){ colorHint = top[0]; state.scan.liveText += ` · Tipo≈${top[0]}`; }
      }

      // pHash: hash perceptual del ROI carta completo
      // Solo activo si phash.json está cargado con datos suficientes
      const fullCardCanvas = captureRoiCanvas(video, r);
      phashResults = await findByPhash(fullCardCanvas, 5, 22);
      if(phashResults.length > 0){
        const best = phashResults[0];
        state.scan.liveText += ` · 👁 ${best.card.name}(d=${best.distance})`;
      }
    } catch(e){ /* señales visuales no críticas */ }

    // ── Resolver ──────────────────────────────────────────────────────────────
    const fractions = extractNumberFraction(bestFrac || allNumText);
    let byNumber = [];
    if(fractions.length){
      byNumber = await matchByNumberAndSet(fractions, detectedSetId).catch(()=>[]);
    }

    // Señal de rareza: inferida comparando número OCR con setTotal de cada candidato
    let rarityHint = 'unknown';
    if(bestFrac && byNumber.length > 0){
      const frac = fractions[0];
      // Todos los candidatos comparten el mismo setTotal si el set está identificado
      const tier = rarityTierFromNumber(frac.number, byNumber[0].setTotal);
      if(tier !== 'unknown') rarityHint = tier;
    }

    // Aplicar bonus de señales (solo si hay más de 1 candidato — si hay 1 es certeza)
    const signals = { rarityHint, typeScores };
    if(byNumber.length > 1) byNumber = applySignalBonus(byNumber, signals);

    function smartGuessName(txt){
      const cands=[];
      for(const line of txt.split('\n').map(l=>l.trim()).filter(Boolean)){
        if(/^[\d\s\/\.\-]+$/.test(line)) continue;
        const cl=line.replace(/[^A-Za-z\u00C0-\u00FF'\- ]/g,'').trim();
        if(cl.length<2||cl.length>30) continue;
        if(/^[A-Z]{1,4}\d{1,3}[a-z]?$/.test(cl)) continue;
        cands.push(cl);
      }
      if(!cands.length) return '';
      cands.sort((a,b)=>(/^[A-Z]/.test(b)?1:0)-(/^[A-Z]/.test(a)?1:0)||b.length-a.length);
      return cands[0];
    }

    const guess = smartGuessName(nameText);
    let byName = [];
    if(guess.length>=2) byName = await searchCards(guess).catch(()=>[]);

    // Limpiar estado previo
    state.scan.pendingConfirm = null;
    state.scan.nameResults = [];
    state.scan.suggestions = [];

    // ── Decisión ──────────────────────────────────────────────────────────────
    if(byNumber.length===1){
      // Carta única por número → pedir confirmación visual antes de añadir
      state.scan.pendingConfirm = byNumber[0];
      state.scan.liveMessage = '¿Es esta la carta?';
      render(); return;
    }

    if(byNumber.length>1){
      // Varios por número → refinar con nombre
      const g = guess.toLowerCase();
      const refined = g ? byNumber.filter(c=>{
        const n=c.name.toLowerCase();
        return n.startsWith(g)||g.startsWith(n)||n.includes(g)||g.includes(n);
      }) : [];
      if(refined.length===1){
        state.scan.pendingConfirm = refined[0];
        state.scan.liveMessage = '¿Es esta la carta?';
        render(); return;
      }
      // Aún hay ambigüedad → mostrar lista de candidatos
      state.scan.suggestions = (refined.length ? refined : byNumber).slice(0,6);
      state.scan.liveMessage = '👆 Varias coincidencias. ¿Cuál es?';
      render(); return;
    }

    // Número no detectado → usar pHash primero, luego nombre
    if(byName.length === 0 && phashResults.length === 0){
      if(bestFrac){
        state.scan.liveMessage=`⚠️ Leí "${bestFrac}"${detectedSetId?' ('+detectedSetId+')':''} pero no está en el catálogo.`;
      } else {
        state.scan.liveMessage='⚠️ No pude leer el número. Centra el recuadro amarillo sobre "128/182" incluyendo el código antes (PAR/TEF…).';
      }
      render(); return;
    }

    // pHash encontró candidatos visuales → mostrarlos para confirmar
    if(phashResults.length > 0 && byName.length === 0){
      if(phashResults[0].distance <= 10){
        // Distancia muy baja = alta confianza visual
        state.scan.pendingConfirm = phashResults[0].card;
        state.scan.liveMessage = `👁 Reconocida visualmente (d=${phashResults[0].distance}). ¿Es esta?`;
        render(); return;
      }
      // Distancia moderada → mostrar las mejores como opciones
      state.scan.nameResults = phashResults.map(r => r.card).slice(0, 6);
      state.scan.liveMessage = `👁 Candidatas por imagen — ¿cuál es?`;
      render(); return;
    }

    // Solo nombre disponible
    if(byName.length){
      state.scan.nameResults = byName.slice(0,9);
      state.scan.liveMessage = guess
        ? `No vi el número. Encontré cartas de "${guess}" — ¿es alguna de estas?`
        : 'No vi el número. Resultados por nombre:';
      render(); return;
    }

  }catch(e){
    console.error(e);
    state.scan.liveError=e?.message||String(e);
    state.scan.liveMessage='⚠️ Error. Inténtalo de nuevo.';
    render();
  }finally{ liveBusy=false; }
}


function addScannedCard(card, lockMs=3000){
  addCardToCollection(card);
  state.scan.recent.unshift(card);
  state.scan.recent=state.scan.recent.slice(0,6);
  state.scan.cooldownUntil=Date.now()+lockMs;
  state.scan.suggestions=[];
  resetLiveRecognitionStability();
  render();
  queueLiveRecognitionFrame(lockMs);
}

/* ---------- acciones de colección ---------- */
function addCardToCollection(card){
  const existing = state.collection.find(c => c.id === card.id);
  if(existing){
    existing.qty += 1;
  }else{
    state.collection.push({ ...card, qty: 1 });
  }
  saveCollection();
  showToast(`${card.name} añadida al álbum`);
}
function changeQty(id, delta){
  const item = state.collection.find(c => c.id === id);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){
    state.collection = state.collection.filter(c => c.id !== id);
  }
  saveCollection();
  render();
}
function removeCard(id){
  state.collection = state.collection.filter(c => c.id !== id);
  saveCollection();
  render();
}

/* ---------- toast ---------- */
let toastTimer;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

/* ---------- render helpers ---------- */
function priceLine(card){
  const eur = card.cardmarketEUR != null ? `<span class="p-eur">€${card.cardmarketEUR.toFixed(2)}</span>` : `<span style="color:var(--muted)">Sin precio Cardmarket</span>`;
  const usd = card.tcgplayerUSD != null ? `<span class="p-usd">$${card.tcgplayerUSD.toFixed(2)}</span>` : `<span style="color:var(--muted)">Sin precio TCGplayer</span>`;
  return `<div class="prices">${eur}${usd}</div>`;
}

function resultCardHTML(card, idx){
  return `
    <div class="result-card" data-add-idx="${idx}">
      <img src="${card.image}" alt="${card.name}" loading="lazy">
      <div class="rname">${card.name}</div>
      <div class="rset">${card.setName}${card.number ? ' · #' + card.number : ''}</div>
    </div>`;
}

/* ---------- render por pestaña ---------- */
function renderScanTab(){
  const modeRow = `<div class="mode-row">
    <div class="chip ${state.scan.mode==='live'?'active':''}" data-mode="live">Cámara en vivo</div>
    <div class="chip ${state.scan.mode==='photo'?'active':''}" data-mode="photo">Foto individual</div>
  </div>`;
  if(state.scan.mode === 'live') renderScanTabLive(modeRow);
  else renderScanTabPhoto(modeRow);
}

    html+=`<div class="video-wrap">
      <video id="liveVideo" playsinline muted autoplay></video>
      <div id="roiCard" class="roi-card"></div>

    </div>
    <div class="live-status"><span class="dot"></span><span id="liveStatusText">${escapeHtml(s.liveMessage||'Preparando…')}</span></div>
    ${s.liveText?`<div class="ocr-debug">${escapeHtml(s.liveText)}</div>`:''}
    ${s.liveError?`<div class="ocr-error" style="font-size:11px;color:#f66;padding:3px 4px">${escapeHtml(s.liveError)}</div>`:''}

    ${s.pendingConfirm ? (()=>{
      const c = s.pendingConfirm;
      const price = c.eur ? `€${c.eur.toFixed(2)}` : (c.usd ? `$${c.usd.toFixed(2)}` : '');
      return `<div class="confirm-banner">
        <img src="${c.image}" alt="${escapeHtml(c.name)}">
        <div class="confirm-info">
          <strong>${escapeHtml(c.name)}</strong>
          <span>${escapeHtml(c.setName)} · #${escapeHtml(c.number||'')} / ${c.setTotal}</span>
          ${price ? `<div class="confirm-price">${price}</div>` : ''}
        </div>
        <div class="confirm-actions">

          <button class="btn btn-ghost" id="confirmNoBtn">❌ No es esta</button>

    ${s.nameResults.length ? `<div class="name-results-header">
        Cartas de "${escapeHtml(s.nameResults[0]?.name?.split(' ')[0]||'')}" — toca la correcta
        <span>${s.nameResults.length} versiones</span>

      <div class="name-results-grid">
        ${s.nameResults.map((c,i)=>`
          <div class="name-result-item" data-name-idx="${i}">

            <div class="nri-name">${escapeHtml(c.name)}</div>
            <div class="nri-set">${escapeHtml(c.setName)}<br>#${escapeHtml(c.number||'')}</div>
          </div>`).join('')}
      </div>` : ''}`;    if(adjusting){
      html+=`<div class="camera-adjust">
        <div class="roi-legend">
          <span class="roi-legend-card">■ Azul</span> = carta entera &nbsp;·&nbsp;
          <span class="roi-legend-num">■ Amarillo</span> = número de carta
        </div>
        <div style="font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:8px">
          El número <strong style="color:var(--text)">"128/182"</strong> está impreso en la <strong style="color:var(--accent)">esquina inferior izquierda</strong> de la carta física, justo encima del copyright. Mueve el recuadro amarillo hasta ahí y hazlo pequeño para que solo cubra esos dígitos.
        </div>
        <div class="zoom-row" style="margin-top:8px">
          <button class="btn btn-ghost zoom-btn" id="zoomOutBtn">−</button>
          <input id="zoomRange" class="zoom-range" type="range" min="${s.zoomMin}" max="${s.zoomMax}" step="${s.zoomStep}" value="${s.zoom}">
          <button class="btn btn-ghost zoom-btn" id="zoomInBtn">+</button>
          <span id="zoomValue" class="zoom-value">${s.zoom.toFixed(1)}×</span>
        </div>
        <div class="adjust-actions">
          <button class="btn btn-ghost" id="resetZoomBtn">Restablecer zoom</button>
          <button class="btn btn-primary" id="beginScanBtn">📸 Capturar y reconocer</button>

    } else {

  document.getElementById('main').innerHTML=html;
  if(s.liveActive){
    requestAnimationFrame(()=>{
      const v=document.getElementById('liveVideo');
      if(v&&mediaStream){v.srcObject=mediaStream;v.play().catch(()=>{});}
      updateCameraZoomUI(); updateRoiUI(); attachRoiDrag();
    });
  }
}

function renderScanTabPhoto(modeRow){
  const s = state.scan.photo;
  let html = modeRow;
  html += `<div class="card-box">
    <h2 class="section-title" style="margin-top:0">Fotografía la carta</h2>
    <label class="btn btn-primary" for="fileInput">Tomar foto o elegir imagen</label>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
    <p class="hint">El reconocimiento de texto no es perfecto: revisa el nombre detectado antes de buscar, o corrígelo a mano.</p>
  </div>`;

  if(s.image){
    html += `<h2 class="section-title">Vista previa</h2>
    <div class="card-box">
      <div class="preview-wrap">
        <img src="${s.image}" alt="Carta escaneada">
        <div style="flex:1">
          <div class="status-line">
            ${s.status === 'ocr' ? '<span class="spinner"></span> Leyendo texto de la carta…' : ''}
            ${s.status === 'searching' ? '<span class="spinner"></span> Buscando coincidencias…' : ''}
            ${s.status === 'done' ? 'Confirma o corrige el nombre y busca de nuevo si hace falta.' : ''}
            ${s.status === 'error' ? 'No se pudo leer la imagen. Escribe el nombre manualmente.' : ''}
          </div>
        </div>
      </div>
      <input type="text" id="guessInput" placeholder="Nombre de la carta" value="${s.guess.replace(/"/g,'&quot;')}">
      <div style="height:10px"></div>
      <button class="btn btn-ghost" id="scanSearchBtn" style="width:100%">Buscar esta carta</button>
    </div>`;
  }

  if(s.results.length){
    html += `<h2 class="section-title">Elige la carta correcta (${s.results.length})</h2>
    <div class="result-grid" id="scanResults">
      ${s.results.map((c,i)=>resultCardHTML(c,i)).join('')}

function renderSearchTab(){
  const s = state.search;
  let html = `<div class="card-box">
    <h2 class="section-title" style="margin-top:0">Busca por nombre</h2>
    <input type="text" id="searchInput" placeholder="Ej. Pikachu, Charizard…" value="${s.query.replace(/"/g,'&quot;')}">
    <div style="height:10px"></div>
    <button class="btn btn-primary" id="searchBtn">Buscar</button>
  </div>`;

  if(s.status === 'searching'){
    html += `<p class="hint"><span class="spinner"></span> Buscando…</p>`;
  }else if(s.status === 'error'){
    html += `<p class="hint">Hubo un problema al consultar la API. Inténtalo de nuevo.</p>`;
  }else if(s.results.length){
    html += `<h2 class="section-title">Resultados (${s.results.length})</h2>
    <div class="result-grid" id="searchResults">
      ${s.results.map((c,i)=>resultCardHTML(c,i)).join('')}
    </div>`;
  }else if(s.status === 'done'){
    html += `<p class="hint">Sin resultados para "${s.query}".</p>`;
  }

  document.getElementById('main').innerHTML = html;
}

function renderCollectionTab(){
  const col = state.collection;
  let html = `<div class="sort-row">
    <div class="chip ${state.sortMode==='expansion'?'active':''}" data-sort="expansion">Por expansión</div>
    <div class="chip ${state.sortMode==='price-desc'?'active':''}" data-sort="price-desc">Precio ↓</div>
    <div class="chip ${state.sortMode==='price-asc'?'active':''}" data-sort="price-asc">Precio ↑</div>
  </div>`;

  html += `<div style="display:flex; gap:16px; margin-bottom:16px;">
    <span id="exportCollectionBtn" style="font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer;">Exportar colección</span>
    <label for="importCollectionInput" style="font-size:12px; color:var(--muted); text-decoration:underline; cursor:pointer;">Importar colección</label>
    <input type="file" id="importCollectionInput" accept="application/json" style="display:none">
  </div>`;

  if(col.length === 0){
    html += `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.5h16"/></svg>
      <p>Tu álbum está vacío.<br>Escanea o busca una carta para empezar.</p>
    </div>`;
    document.getElementById('main').innerHTML = html;
    return;
  }

  const priceOf = (c) => c.cardmarketEUR != null ? c.cardmarketEUR : (c.tcgplayerUSD != null ? c.tcgplayerUSD : -1);

  if(state.sortMode === 'expansion'){
    const groups = {};
    col.forEach(c=>{
      if(!groups[c.setName]) groups[c.setName] = { order: setOrderFor(c.setId, c.setName), items: [] };
      groups[c.setName].items.push(c);
    });
    const groupNames = Object.keys(groups).sort((a,b)=> groups[b].order - groups[a].order);
    groupNames.forEach(name=>{
      const items = groups[name].items.sort((a,b)=> priceOf(b) - priceOf(a));
      const subtotalEUR = items.reduce((s,c)=> s + (c.cardmarketEUR||0)*c.qty, 0);
      html += `<div class="group-header">
        <div class="gname">${name}</div>
        <div class="gcount">${items.length} ${items.length===1?'carta':'cartas'} · €${subtotalEUR.toFixed(2)}</div>
      </div>`;
      items.forEach(c=> html += rowHTML(c));
    });
  }else{
    const sorted = [...col].sort((a,b)=> state.sortMode==='price-desc' ? priceOf(b)-priceOf(a) : priceOf(a)-priceOf(b));
    sorted.forEach(c=> html += rowHTML(c));
  }

  document.getElementById('main').innerHTML = html;
}

function rowHTML(c){
  return `<div class="row">
    <img src="${c.image}" alt="${c.name}">
    <div class="info">
      <div class="rname">${c.name}</div>
      <div class="rmeta">${c.setName}${c.number ? ' · #' + c.number : ''}</div>
      ${priceLine(c)}
    </div>
    <div class="qty">
      <button data-qty="-1" data-id="${c.id}">−</button>
      <span class="n">${c.qty}</span>
      <button data-qty="1" data-id="${c.id}">+</button>
    </div>
    <button class="del" data-remove="${c.id}">✕</button>
  </div>`;
}

/* ---------- pestaña de expansiones ---------- */
function renderExpansionTab(){
  if(state.expansion.view === 'cards' && state.expansion.selectedSet) renderExpansionCards();
  else renderExpansionSets();
}

function renderExpansionSets(){
  const e = state.expansion;
  let html = `<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px;">
    <h2 class="section-title" style="margin:0">Elige una expansión</h2>
    ${e.sets ? `<span id="refreshSets" style="font-size:11.5px; color:var(--muted); text-decoration:underline; cursor:pointer;">Actualizar catálogo</span>` : ''}
  </div>`;

  if(e.setsStatus === 'loading' || e.sets === null){
    html += `<p class="hint"><span class="spinner"></span> Cargando expansiones…</p>`;
    document.getElementById('main').innerHTML = html;
    return;
  }
  if(e.setsStatus === 'error'){
    html += `<p class="hint">No se pudieron cargar las expansiones.${e.setsError ? ' (' + e.setsError + ')' : ''}</p>
      <button class="btn btn-ghost" id="retryLoadSets" style="width:100%">Reintentar</button>`;
    document.getElementById('main').innerHTML = html;
    return;
  }

  html += `<div class="set-list">` + e.sets.map(s=>{
    const owned = ownedCountForSet(s.id, s.name);
    const total = s.total || 0;
    const pct = total ? Math.min(100, Math.round((owned/total)*100)) : 0;
    return `<div class="set-row" data-set-id="${s.id}">
      <img class="set-logo" src="${s.symbol || ''}" alt="${s.name}" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="set-info">
        <div class="set-name">${s.name}</div>
        <div class="set-meta">${s.id}</div>
        <div class="set-progress-bar"><div class="fill" style="width:${pct}%"></div></div>
      </div>
      <div class="set-count">${owned}/${total || '?'}</div>
    </div>`;
  }).join('') + `</div>`;

  document.getElementById('main').innerHTML = html;
}

function renderExpansionCards(){
  const e = state.expansion;
  const set = e.selectedSet;
  const owned = ownedCountForSet(set.id, set.name);
  const total = set.total || e.cards.length;

  let html = `<div class="back-row" id="expBackBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <span>Expansiones</span>
  </div>`;

  html += `<div class="set-header">
    <img src="${set.symbol || ''}" alt="${set.name}" onerror="this.style.visibility='hidden'">
    <div>
      <div class="shname">${set.name}</div>
      <div class="shcount">${owned} de ${total} cartas</div>
    </div>
  </div>`;

  html += `<div class="exp-filter-row">
    <div class="chip ${e.filter==='all'?'active':''}" data-expfilter="all">Todas</div>
    <div class="chip ${e.filter==='owned'?'active':''}" data-expfilter="owned">Las tengo</div>
    <div class="chip ${e.filter==='missing'?'active':''}" data-expfilter="missing">Me faltan</div>
  </div>`;

  if(e.cardsStatus === 'loading'){
    html += `<p class="hint"><span class="spinner"></span> Cargando cartas de la expansión…</p>`;
  }else if(e.cardsStatus === 'error'){
    html += `<p class="hint">No se pudieron cargar las cartas de esta expansión.${e.cardsError ? ' (' + e.cardsError + ')' : ''}</p>
      <button class="btn btn-ghost" id="retryLoadCards" style="width:100%">Reintentar</button>`;
  }else{
    const ownedIds = new Set(state.collection.map(c=>c.id));
    let cards = e.cards;
    if(e.filter === 'owned') cards = cards.filter(c => ownedIds.has(c.id));
    else if(e.filter === 'missing') cards = cards.filter(c => !ownedIds.has(c.id));

    if(cards.length === 0){
      html += `<p class="hint">No hay cartas que mostrar con este filtro.</p>`;
    }else{
      html += `<div class="checklist-grid">` + cards.map(c=>{
        const isOwned = ownedIds.has(c.id);
        const qty = qtyForCardId(c.id);
        return `<div class="check-card ${isOwned?'owned':'unowned'}" data-card-id="${c.id}">
          <img src="${c.image}" alt="${c.name}" loading="lazy">
          <div class="cc-num">#${c.number}</div>
          ${isOwned ? `<button class="cc-minus" data-minus-id="${c.id}" title="Quitar una copia">−</button>` : ''}
          ${isOwned && qty > 1 ? `<div class="cc-qty">x${qty}</div>` : ''}
        </div>`;
      }).join('') + `</div>
      <p class="hint">Toca una carta para añadirla al álbum (o sumar otra copia). Para quitarla o corregir la cantidad, usa la pestaña Colección.</p>`;
    }
  }

  document.getElementById('main').innerHTML = html;
}

function updateHeader(){
  const total = state.collection.reduce((n,c)=> n + c.qty, 0);
  document.getElementById('collectionCount').textContent = `${total} ${total===1?'carta':'cartas'}`;
  const totalEUR = state.collection.reduce((s,c)=> s + (c.cardmarketEUR||0)*c.qty, 0);
  const totalUSD = state.collection.reduce((s,c)=> s + (c.tcgplayerUSD||0)*c.qty, 0);
  document.getElementById('totalEUR').textContent = `€${totalEUR.toFixed(2)}`;
  document.getElementById('totalUSD').textContent = `$${totalUSD.toFixed(2)}`;
}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  if(state.tab === 'scan') renderScanTab();
  else if(state.tab === 'search') renderSearchTab();
  else if(state.tab === 'expansion') renderExpansionTab();
  else renderCollectionTab();
  updateHeader();
  attachDynamicListeners();
  if(state.tab === 'scan' && state.scan.mode === 'live' && state.scan.liveActive){
    const video = document.getElementById('liveVideo');
    if(video && video.srcObject !== mediaStream){
      video.srcObject = mediaStream;
      video.play().catch(()=>{});
    }
  }
}

/* ---------- listeners dinámicos (regenerados en cada render) ---------- */
function attachDynamicListeners(){
  document.querySelectorAll('.chip[data-mode]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(state.scan.mode === el.dataset.mode) return;
      if(state.scan.liveActive) stopLiveScan();
      state.scan.mode = el.dataset.mode;
      render();
    });
  });
  const startLiveBtn = document.getElementById('startLiveBtn');
  if(startLiveBtn){
    startLiveBtn.addEventListener('click', ()=> startLiveScan());
  }
  const beginScanBtn = document.getElementById('beginScanBtn');
  if(beginScanBtn){
    beginScanBtn.addEventListener('click', ()=> beginLiveRecognition());
  }
  const captureAgainBtn = document.getElementById('captureAgainBtn');
  if(captureAgainBtn){
    captureAgainBtn.addEventListener('click', ()=> captureAndRecognize());
  }
  const adjustAgainBtn = document.getElementById('adjustAgainBtn');
  if(adjustAgainBtn){
    adjustAgainBtn.addEventListener('click', ()=> resetToAdjust());
  }
  const stopLiveBtn = document.getElementById('stopLiveBtn');
  if(stopLiveBtn){
    stopLiveBtn.addEventListener('click', ()=>{ stopLiveScan(); render(); });
  }
  const zoomRange = document.getElementById('zoomRange');
  if(zoomRange){
    zoomRange.addEventListener('input', ()=> applyCameraZoom(zoomRange.value));
  }
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  if(zoomOutBtn){
    zoomOutBtn.addEventListener('click', ()=> applyCameraZoom((state.scan.zoom || 1) - (state.scan.zoomStep || 0.1)));
  }
  const zoomInBtn = document.getElementById('zoomInBtn');
  if(zoomInBtn){
    zoomInBtn.addEventListener('click', ()=> applyCameraZoom((state.scan.zoom || 1) + (state.scan.zoomStep || 0.1)));
  }
  const resetZoomBtn = document.getElementById('resetZoomBtn');
  if(resetZoomBtn){
    resetZoomBtn.addEventListener('click', ()=> applyCameraZoom(state.scan.zoomMin || 1));
  }
  document.querySelectorAll('[data-suggest-idx]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const card = state.scan.suggestions[parseInt(el.dataset.suggestIdx,10)];
      if(!card) return;
      addScannedCard(card, 6000);
    });
  });

  const confirmYesBtn = document.getElementById('confirmYesBtn');
  if(confirmYesBtn){
    confirmYesBtn.addEventListener('click', ()=>{
      if(state.scan.pendingConfirm){
        addScannedCard(state.scan.pendingConfirm, 3000);
        state.scan.pendingConfirm = null;
      }
    });
  }
  const confirmNoBtn = document.getElementById('confirmNoBtn');
  if(confirmNoBtn){
    confirmNoBtn.addEventListener('click', ()=>{
      state.scan.pendingConfirm = null;
      state.scan.liveMessage = '↩️ De acuerdo. Ajusta los recuadros e inténtalo de nuevo.';
      render();
    });
  }

  document.querySelectorAll('[data-name-idx]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const card = state.scan.nameResults[parseInt(el.dataset.nameIdx,10)];
      if(!card) return;
      addScannedCard(card, 6000);
    });
  });

  const fileInput = document.getElementById('fileInput');
  if(fileInput){
    fileInput.addEventListener('change', onFileSelected);
  }
  const guessInput = document.getElementById('guessInput');
  if(guessInput){
    guessInput.addEventListener('input', (e)=>{ state.scan.photo.guess = e.target.value; });
  }
  const scanSearchBtn = document.getElementById('scanSearchBtn');
  if(scanSearchBtn){
    scanSearchBtn.addEventListener('click', ()=> doScanSearch());
  }
  const scanResults = document.getElementById('scanResults');
  if(scanResults){
    scanResults.querySelectorAll('[data-add-idx]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const card = state.scan.photo.results[parseInt(el.dataset.addIdx,10)];
        addCardToCollection(card);
      });
    });
  }
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{ state.search.query = e.target.value; });
    searchInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') doSearch(); });
  }
  const searchBtn = document.getElementById('searchBtn');
  if(searchBtn){
    searchBtn.addEventListener('click', ()=> doSearch());
  }
  const searchResults = document.getElementById('searchResults');
  if(searchResults){
    searchResults.querySelectorAll('[data-add-idx]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const card = state.search.results[parseInt(el.dataset.addIdx,10)];
        addCardToCollection(card);
      });
    });
  }
  document.querySelectorAll('.chip[data-sort]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.sortMode = el.dataset.sort; render(); });
  });
  document.querySelectorAll('[data-qty]').forEach(el=>{
    el.addEventListener('click', ()=> changeQty(el.dataset.id, parseInt(el.dataset.qty,10)));
  });
  document.querySelectorAll('[data-remove]').forEach(el=>{
    el.addEventListener('click', ()=> removeCard(el.dataset.remove));
  });

  document.querySelectorAll('.set-row[data-set-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const set = state.expansion.sets.find(s => s.id === el.dataset.setId);
      if(set) openSet(set);
    });
  });
  const retryLoadSets = document.getElementById('retryLoadSets');
  if(retryLoadSets){
    retryLoadSets.addEventListener('click', ()=> loadSets());
  }
  const refreshSets = document.getElementById('refreshSets');
  if(refreshSets){
    refreshSets.addEventListener('click', ()=> refreshSetsCatalog());
  }
  const expBackBtn = document.getElementById('expBackBtn');
  if(expBackBtn){
    expBackBtn.addEventListener('click', ()=>{
      state.expansion.view = 'sets';
      state.expansion.selectedSet = null;
      render();
    });
  }
  const retryLoadCards = document.getElementById('retryLoadCards');
  if(retryLoadCards){
    retryLoadCards.addEventListener('click', ()=> openSet(state.expansion.selectedSet));
  }
  document.querySelectorAll('.chip[data-expfilter]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.expansion.filter = el.dataset.expfilter; render(); });
  });
  document.querySelectorAll('.check-card[data-card-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const card = state.expansion.cards.find(c => c.id === el.dataset.cardId);
      if(!card) return;
      addCardToCollection(card);
      render();
    });
  });
  document.querySelectorAll('[data-minus-id]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      changeQty(el.dataset.minusId, -1);
    });
  });
  const exportBtn = document.getElementById('exportCollectionBtn');
  if(exportBtn){
    exportBtn.addEventListener('click', exportCollection);
  }
  const importInput = document.getElementById('importCollectionInput');
  if(importInput){
    importInput.addEventListener('change', importCollection);
  }
}

/* ---------- flujos async ---------- */
async function onFileSelected(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await resizeImage(file);
    state.scan.photo = { image: dataUrl, status: 'ocr', guess: '', results: [] };
    render();
    const text = await runOCR(dataUrl);
    const guess = guessNameFromText(text);
    state.scan.photo.guess = guess;
    state.scan.photo.status = 'searching';
    render();

    const fractions = extractNumberFraction(text);
    const byNumber = await matchByNumberFraction(fractions).catch(()=>[]);
    const byName = guess ? await searchCards(guess).catch(()=>[]) : [];

    // el número manda si es concluyente; si no, se combina con el nombre
    let results = byNumber.length ? byNumber : byName;
    if(byNumber.length > 1 && byName.length){
      const ids = new Set(byName.map(c=>c.id));
      const refined = byNumber.filter(c => ids.has(c.id));
      if(refined.length) results = refined;
    }
    state.scan.photo.results = results;
    state.scan.photo.status = 'done';
    render();
  }catch(err){
    console.error(err);
    state.scan.photo.status = 'error';
    render();
  }
}

async function doScanSearch(){
  const name = state.scan.photo.guess;
  if(!name.trim()) return;
  state.scan.photo.status = 'searching';
  state.scan.photo.results = [];
  render();
  try{
    state.scan.photo.results = await searchCards(name);
  }catch(err){
    console.error(err);
  }
  state.scan.photo.status = 'done';
  render();
}

async function doSearch(){
  const q = state.search.query;
  if(!q.trim()) return;
  state.search.status = 'searching';
  state.search.results = [];
  render();
  try{
    state.search.results = await searchCards(q);
  }catch(err){
    console.error(err);
    state.search.status = 'error';
    render();
    return;
  }
  state.search.status = 'done';
  render();
}

async function refreshSetsCatalog(){
  state.expansion.sets = null;
  await loadSets();
}

async function loadSets(){
  state.expansion.setsStatus = 'loading';
  state.expansion.setsError = '';
  render();
  try{
    const sets = await fetchAllSets();
    sets.sort((a,b)=> (b.order||0) - (a.order||0));
    state.expansion.sets = sets;
    state.expansion.setsStatus = 'done';
  }catch(err){
    console.error(err);
    state.expansion.setsError = err.message || 'Error desconocido';
    state.expansion.setsStatus = 'error';
  }
  render();
}

async function openSet(set){
  state.expansion.selectedSet = set;
  state.expansion.view = 'cards';
  state.expansion.filter = 'all';
  state.expansion.cardsError = '';
  if(state.expansion.cardsCache[set.id]){
    state.expansion.cards = state.expansion.cardsCache[set.id];
    state.expansion.cardsStatus = 'done';
    render();
    return;
  }
  state.expansion.cards = [];
  state.expansion.cardsStatus = 'loading';
  render();
  try{
    const cards = await fetchSetCards(set);
    cards.sort(naturalCardSort);
    state.expansion.cardsCache[set.id] = cards;
    state.expansion.cards = cards;
    state.expansion.cardsStatus = 'done';
  }catch(err){
    console.error(err);
    state.expansion.cardsError = err.message || 'Error desconocido';
    state.expansion.cardsStatus = 'error';
  }
  render();
}

/* ---------- navegación de pestañas ---------- */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.dataset.tab !== 'scan' && state.scan.liveActive) stopLiveScan();
    state.tab = btn.dataset.tab;
    render();
    if(state.tab === 'expansion' && state.expansion.sets === null && state.expansion.setsStatus === 'idle'){
      loadSets();
    }
  });
});

/* ---------- init ---------- */
(async function init(){
  await loadOptionalScript('./config.local.js');
  await setupAuth();
  await loadCollection();
  render();
  ensureGlobalIndex().catch(err=> console.error('No se pudo precargar el índice de cartas', err));
  ensurePhash().catch(()=>{});  // precargar phash.json en segundo plano (falla silenciosamente si no existe)
  if(state.expansion.sets === null && state.expansion.setsStatus === 'idle'){
    loadSets();
  }
})();
</script>
