/* ---------- ocr ---------- */
function resizeImage(file, maxWidth=900){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('No se pudo leer la imagen'));
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.9));
      };
      img.onerror = () => reject(new Error('Imagen no válida'));
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function loadCanvasFromDataUrl(dataUrl){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      resolve(canvas);
    };
    img.onerror = () => reject(new Error('Imagen no válida'));
    img.src = dataUrl;
  });
}

function cropRatioCanvas(src, rx, ry, rw, rh, { scaleUp=false } = {}){
  const sx = Math.max(0, Math.round(src.width * rx));
  const sy = Math.max(0, Math.round(src.height * ry));
  const sw = Math.max(1, Math.min(src.width - sx, Math.round(src.width * rw)));
  const sh = Math.max(1, Math.min(src.height - sy, Math.round(src.height * rh)));
  const scale = scaleUp ? Math.max(4, Math.min(8, 3600 / Math.max(sw, sh))) : 1;
  const dst = document.createElement('canvas');
  dst.width = Math.max(1, Math.round(sw * scale));
  dst.height = Math.max(1, Math.round(sh * scale));
  const ctx = dst.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, sx, sy, sw, sh, 0, 0, dst.width, dst.height);
  return dst;
}

const RECOGNITION_LANGUAGE_SUFFIXES = new Set(['EN','ES','FR','DE','IT','PT','JA','KO','ZH','TH','ID','RU','NL','PL']);
let recognitionCatalogPromise = null;
let recognitionCatalog = null;
let liveScanTimer = null;

function normalizeRecognitionSetCode(value){
  const cleaned = String(value ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(!cleaned) return '';
  if(cleaned.length > 2 && RECOGNITION_LANGUAGE_SUFFIXES.has(cleaned.slice(-2))){
    return cleaned.slice(0, -2);
  }
  return cleaned;
}

function normalizeRecognitionCardNumber(value){
  const cleaned = String(value ?? '').toUpperCase().replace(/[^0-9A-Z]/g, '');
  if(!cleaned) return '';
  const match = cleaned.match(/^0*(\d+)([A-Z]*)$/);
  if(match) return `${match[1]}${match[2] || ''}`;
  return cleaned;
}

function matchesSetCodeWithinOneEdit(a, b){
  if(!a || !b) return false;
  if(a === b) return true;
  if(Math.abs(a.length - b.length) > 1) return false;
  let i = 0;
  let j = 0;
  let edits = 0;
  while(i < a.length && j < b.length){
    if(a[i] === b[j]){
      i += 1;
      j += 1;
      continue;
    }
    edits += 1;
    if(edits > 1) return false;
    if(a.length > b.length){
      i += 1;
    }else if(b.length > a.length){
      j += 1;
    }else{
      i += 1;
      j += 1;
    }
  }
  return true;
}

function resolveClosestSetCode(input, codes){
  if(!input) return '';
  if(codes.includes(input)) return input;
  let best = '';
  let bestPrefix = -1;
  for(const code of codes){
    if(!matchesSetCodeWithinOneEdit(input, code)) continue;
    let prefix = 0;
    while(prefix < input.length && prefix < code.length && input[prefix] === code[prefix]) prefix += 1;
    if(prefix > bestPrefix){
      bestPrefix = prefix;
      best = code;
    }
  }
  return best;
}

async function ensureRecognitionCatalog(){
  if(recognitionCatalog) return recognitionCatalog;
  if(!recognitionCatalogPromise){
    recognitionCatalogPromise = ensureGlobalIndex().then(index => {
      const bySetCode = new Map();
      const setCodes = [];
      const seen = new Set();
      for(const card of index){
        const setCode = String(card.setId || '');
        if(!setCode) continue;
        if(!bySetCode.has(setCode)) bySetCode.set(setCode, []);
        bySetCode.get(setCode).push(card);
        if(!seen.has(setCode)){
          seen.add(setCode);
          setCodes.push(setCode);
        }
      }
      recognitionCatalog = { index, bySetCode, setCodes };
      return recognitionCatalog;
    });
  }
  return recognitionCatalogPromise;
}

function extractRecognitionSignals(text){
  const lines = String(text || '').split(/\n+/).map(line => line.trim()).filter(Boolean);
  const out = [];
  const seen = new Set();
  const push = (setCode, number, total, rawLine) => {
    const rawSet = String(setCode || '').trim();
    const normalizedNumber = normalizeRecognitionCardNumber(number);
    const normalizedTotal = parseInt(total, 10);
    if(!normalizedNumber || !Number.isFinite(normalizedTotal)) return;
    const key = `${rawSet}|${normalizedNumber}|${normalizedTotal}`;
    if(seen.has(key)) return;
    seen.add(key);
    out.push({ setCode: rawSet, number: normalizedNumber, total: normalizedTotal, rawLine });
  };

  for(const originalLine of lines){
    const line = originalLine.replace(/[|•·]/g, ' ').replace(/\s+/g, ' ').trim();
    if(!line) continue;

    for(const match of line.matchAll(/(\d{1,3}[A-Za-z]?)\s*\/\s*(\d{1,3})/g)){
      push(line.slice(0, match.index).trim(), match[1], match[2], originalLine);
    }

    for(const match of line.matchAll(/(\d{1,3}[A-Za-z]?)\s{1,3}(\d{1,3})/g)){
      push(line.slice(0, match.index).trim(), match[1], match[2], originalLine);
    }
  }

  return out;
}

function queueLiveRecognitionFrame(delay = 3000){
  if(liveScanTimer){
    clearTimeout(liveScanTimer);
    liveScanTimer = null;
  }
  if(!state.scan.liveActive) return;
  liveScanTimer = setTimeout(() => {
    liveScanTimer = null;
    captureAndRecognize();
  }, Math.max(0, delay));
}

function maybeNormalizeRecognitionResult(result){
  return {
    card: result.card,
    score: result.score,
    signal: result.signal,
    key: result.card.id
  };
}

function setIdFromPrintedToken(token){
  const raw = String(token || '').trim();
  if(!raw) return { setId: '', fuzzy: false };
  const direct = extractSetCode(raw);
  if(direct) return { setId: direct, fuzzy: false };
  const cleaned = normalizeRecognitionSetCode(raw);
  const closest = resolveClosestSetCode(cleaned, Object.keys(SET_CODE_MAP));
  if(!closest) return { setId: '', fuzzy: false };
  return { setId: SET_CODE_MAP[closest], fuzzy: closest !== cleaned };
}

async function findRecognitionCandidates(signals){
  if(!signals.length) return [];
  const catalog = await ensureRecognitionCatalog();
  const candidates = [];
  const seen = new Map();
  const push = (card, score, signal) => {
    const existing = seen.get(card.id);
    if(existing){
      existing.score = Math.max(existing.score, score);
      existing.signal = existing.signal || signal;
      return;
    }
    const candidate = { card, score, signal, key: card.id };
    seen.set(card.id, candidate);
    candidates.push(candidate);
  };

  for(const signal of signals){
    const printed = setIdFromPrintedToken(signal.setCode);
    if(printed.setId){
      const exactCards = catalog.bySetCode.get(printed.setId) || [];
      const score = printed.fuzzy ? 0.86 : 0.96;
      for(const card of exactCards){
        if(normalizeRecognitionCardNumber(card.number) === signal.number){
          push(card, score, signal);
        }
      }
    }
  }

  return candidates.sort((a, b) => b.score - a.score || naturalCardSort(a.card, b.card)).map(maybeNormalizeRecognitionResult);
}

/* ---------- cámara en vivo ---------- */
let mediaStream = null;
let ocrWorker = null;
let cameraTrack = null;
let liveBusy = false;

async function startLiveScan(){
  if(state.scan.liveActive || state.scan.liveStatus === 'starting') return;
  state.scan.liveActive = true;
  state.scan.liveStatus = 'starting';
  state.scan.livePhase = 'adjust';
  state.scan.liveMessage = 'Solicitando acceso a la cámara…';
  state.scan.liveText = '';
  state.scan.liveError = '';
  state.scan.suggestions = [];
  state.scan.cooldownUntil = 0;
  state.scan.zoom = 1;
  state.scan.zoomMin = 1;
  state.scan.zoomMax = 3;
  state.scan.zoomStep = 0.1;
  state.scan.hardwareZoom = false;
  state.scan.roi    = { x: 0.08, y: 0.05, w: 0.84, h: 0.90 };
  state.scan.roiNum = { x: 0.52, y: 0.84, w: 0.36, h: 0.09 };
  render();

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    state.scan.liveActive = false;
    state.scan.liveStatus = 'error';
    state.scan.livePhase = 'idle';
    state.scan.liveError = 'Este navegador no permite acceder a la cámara. Abre la app con HTTPS y comprueba los permisos del sitio.';
    render();
    return;
  }

  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 3840 },
        height: { ideal: 2160 }
      },
      audio: false
    });
    cameraTrack = mediaStream.getVideoTracks()[0] || null;
    if(!cameraTrack) throw new Error('El navegador no devolvió ninguna cámara.');
    await raiseToMaxResolutionOnce(cameraTrack);

    setupCameraZoom();
    state.scan.liveMessage = 'Cámara activa. Ajusta zoom y mueve el recuadro sobre el número…';
    const video = document.getElementById('liveVideo');
    if(!video) throw new Error('No se pudo crear la vista de cámara.');
    bindLivePreview(video);
    await video.play().catch(()=>{});
    render();
    await beginLiveRecognition();
  }catch(err){
    console.error('Error al iniciar cámara:', err);
    if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
    cameraTrack=null;
    state.scan.liveActive=false;
    state.scan.liveStatus='error';
    state.scan.livePhase='idle';
    if(err?.name==='NotAllowedError') state.scan.liveError='Permiso de cámara denegado. Permite la cámara para este sitio y vuelve a intentarlo.';
    else if(err?.name==='NotFoundError') state.scan.liveError='No se encontró ninguna cámara disponible en este dispositivo.';
    else if(err?.name==='NotReadableError') state.scan.liveError='La cámara está siendo usada por otra aplicación o pestaña. Ciérrala y vuelve a intentarlo.';
    else state.scan.liveError='No se pudo iniciar la cámara: '+(err?.message||err?.name||'error desconocido');
    render();
  }
}

/* Una sola vez, justo al abrir. Zoom y Ajustar zona no vuelven a llamar. */
async function raiseToMaxResolutionOnce(track){
  try{
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    const maxW = Number(caps && caps.width && caps.width.max);
    const maxH = Number(caps && caps.height && caps.height.max);
    if(!Number.isFinite(maxW) || !Number.isFinite(maxH) || maxW < 1 || maxH < 1) return;
    await track.applyConstraints({ width: { exact: maxW }, height: { exact: maxH } });
  }catch(e){
    console.warn('No se pudo usar la resolución máxima de la cámara:', e);
  }
}

function setupCameraZoom(){
  // El zoom es solo visual. applyConstraints({zoom}) reinicia la cámara del
  // móvil, baja la resolución y desplaza el encuadre.
  state.scan.hardwareZoom = false;
  state.scan.zoomMin = 1;
  state.scan.zoomMax = 3;
  state.scan.zoomStep = 0.1;
  if(!Number.isFinite(state.scan.zoom) || state.scan.zoom < 1) state.scan.zoom = 1;
}

function bindLivePreview(video){
  if(!video || !mediaStream) return;
  video.muted = true;
  video.playsInline = true;
  if(video.srcObject === mediaStream) return;
  video.srcObject = mediaStream;
  if(video.paused) video.play().catch(()=>{});
}

async function applyCameraZoom(value){
  const min=state.scan.zoomMin||1, max=state.scan.zoomMax||3, step=state.scan.zoomStep||0.1;
  let z=Math.max(min,Math.min(max,Number(value)||min));
  z=Number((Math.round(z/step)*step).toFixed(2));
  state.scan.zoom=z;
  state.scan.hardwareZoom=false;
  updateCameraZoomUI();
}

function updateCameraZoomUI(){
  const range=document.getElementById('zoomRange'), value=document.getElementById('zoomValue');
  if(range){ range.min=state.scan.zoomMin; range.max=state.scan.zoomMax; range.step=state.scan.zoomStep; range.value=state.scan.zoom; }
  if(value) value.textContent=`${state.scan.zoom.toFixed(1)}×`;
}

function updateRoiUI(){
  const elCard = document.getElementById('roiCard');
  const elNum  = document.getElementById('roiNum');
  if(elCard){
    const r = state.scan.roi;
    elCard.style.left   = (r.x*100)+'%';
    elCard.style.top    = (r.y*100)+'%';
    elCard.style.width  = (r.w*100)+'%';
    elCard.style.height = (r.h*100)+'%';
  }
  if(elNum){
    const n = state.scan.roiNum;
    elNum.style.left   = (n.x*100)+'%';
    elNum.style.top    = (n.y*100)+'%';
    elNum.style.width  = (n.w*100)+'%';
    elNum.style.height = (n.h*100)+'%';
  }
}

function attachRoiDrag(){
  const wrap = document.querySelector('.video-wrap');
  if(!wrap) return;

  function makeDraggable(el, getS, setS){
    if(!el) return;
    let active=false, sx=0, sy=0, s0=null;
    const down = e => {
      active=true; s0={...getS()};
      const p=e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY;
      el.setPointerCapture?.(e.pointerId); e.preventDefault(); e.stopPropagation();
    };
    const move = e => {
      if(!active) return;
      const p=e.touches?e.touches[0]:e;
      const rect=wrap.getBoundingClientRect();
      const dx=(p.clientX-sx)/rect.width, dy=(p.clientY-sy)/rect.height;
      setS({ x:Math.max(0,Math.min(1-s0.w, s0.x+dx)), y:Math.max(0,Math.min(1-s0.h, s0.y+dy)), w:s0.w, h:s0.h });
      updateRoiUI(); e.preventDefault();
    };
    const up = () => { active=false; };
    el.addEventListener('pointerdown', down, {passive:false});
    el.addEventListener('pointermove', move, {passive:false});
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }

  function makeResizable(el, getS, setS, minW, minH){
    if(!el) return;
    let active=false, sx=0, sy=0, s0=null;
    const down = e => {
      active=true; s0={...getS()};
      const p=e.touches?e.touches[0]:e; sx=p.clientX; sy=p.clientY;
      el.setPointerCapture?.(e.pointerId); e.preventDefault(); e.stopPropagation();
    };
    const move = e => {
      if(!active) return;
      const p=e.touches?e.touches[0]:e;
      const rect=wrap.getBoundingClientRect();
      const dx=(p.clientX-sx)/rect.width, dy=(p.clientY-sy)/rect.height;
      setS({ x:s0.x, y:s0.y, w:Math.max(minW, Math.min(1-s0.x, s0.w+dx)), h:Math.max(minH, Math.min(1-s0.y, s0.h+dy)) });
      updateRoiUI(); e.preventDefault();
    };
    const up = () => { active=false; };
    el.addEventListener('pointerdown', down, {passive:false});
    el.addEventListener('pointermove', move, {passive:false});
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  }

  makeDraggable(document.getElementById('roiCard'), ()=>state.scan.roi, s=>{ state.scan.roi=s; });
  makeDraggable(document.getElementById('roiNum'),  ()=>state.scan.roiNum, s=>{ state.scan.roiNum=s; });
  makeResizable(document.getElementById('roiNumResize'), ()=>state.scan.roiNum, s=>{ state.scan.roiNum=s; }, 0.06, 0.04);
}

async function ensureOcrWorker(){
  if(ocrWorker) return ocrWorker;
  if(typeof Tesseract==='undefined') throw new Error('Tesseract.js no está cargado');
  ocrWorker = await Tesseract.createWorker('eng', 1, { logger: info => {
    if(!state.scan.liveActive || info?.progress == null || !info.status) return;
    state.scan.liveMessage = `${info.status} ${Math.round(info.progress * 100)}%`;
    const statusEl = document.getElementById('liveStatusText');
    if(statusEl) statusEl.textContent = state.scan.liveMessage;
  }});
  return ocrWorker;
}

async function beginLiveRecognition(){
  if(!state.scan.liveActive) return;
  state.scan.livePhase='scanning';
  state.scan.liveStatus='scanning';
  state.scan.liveMessage='Cargando motor OCR…';
  state.scan.liveText=''; state.scan.liveError=''; state.scan.suggestions=[];
  render();
  attachRoiDrag();
  try{
    await ensureOcrWorker();
  }catch(e){
    console.error(e); ocrWorker=null; state.scan.liveStatus='error'; state.scan.livePhase='adjust';
    state.scan.liveError='No se pudo cargar el motor OCR. Comprueba tu conexión a Internet y recarga la página.'; render(); return;
  }
  state.scan.liveMessage='Listo. Ajusta los recuadros y pulsa Capturar.';
  render();
  requestAnimationFrame(()=>{ updateRoiUI(); attachRoiDrag(); });
}

function stopLiveScan(){
  if(mediaStream) mediaStream.getTracks().forEach(t=>t.stop());
  mediaStream=null; cameraTrack=null; liveBusy=false;
  if(liveScanTimer){ clearTimeout(liveScanTimer); liveScanTimer = null; }
  state.scan.liveActive=false; state.scan.livePhase='idle'; state.scan.liveStatus='idle';
  state.scan.liveMessage='Cámara detenida'; state.scan.liveError=''; state.scan.suggestions=[];
  render();
}

function resetToAdjust(){
  state.scan.livePhase='adjust'; state.scan.liveStatus='starting';
  state.scan.liveMessage='Ajusta los recuadros y pulsa Capturar.';
  state.scan.liveText=''; state.scan.liveError=''; state.scan.suggestions=[];
  render();
}

function getVideoSourceRect(video){
  const vw=video.videoWidth,vh=video.videoHeight;
  const ew=video.clientWidth,eh=video.clientHeight;
  const scale=Math.max(ew/vw,eh/vh);
  const rw=vw*scale,rh=vh*scale;
  return {left:(ew-rw)/2,top:(eh-rh)/2,width:rw,height:rh};
}

function preprocessForOCR(srcCanvas){
  const sw=srcCanvas.width, sh=srcCanvas.height;
  const dst=document.createElement('canvas'); dst.width=sw; dst.height=sh;
  const ctx=dst.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(srcCanvas,0,0);
  const imgData=ctx.getImageData(0,0,sw,sh); const d=imgData.data;

  // 1. Escala de grises perceptual
  const gray=new Uint8Array(sw*sh);
  for(let i=0,p=0;i<d.length;i+=4,p++)
    gray[p]=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);

  // 2. Unsharp mask 3×3 — realza bordes del texto
  const blur=new Uint8Array(sw*sh);
  for(let y=0;y<sh;y++) for(let x=0;x<sw;x++){
    let s=0,w=0;
    for(let ky=-1;ky<=1;ky++) for(let kx=-1;kx<=1;kx++){
      const nx=x+kx,ny=y+ky;
      if(nx>=0&&nx<sw&&ny>=0&&ny<sh){
        const wt=[1,2,1,2,4,2,1,2,1][(ky+1)*3+(kx+1)]; s+=gray[ny*sw+nx]*wt; w+=wt;
      }
    }
    blur[y*sw+x]=Math.round(s/w);
  }
  const sharp=new Uint8Array(sw*sh);
  for(let i=0;i<gray.length;i++)
    sharp[i]=Math.max(0,Math.min(255,Math.round(gray[i]+2.0*(gray[i]-blur[i]))));

  // 3. Detectar si el texto es oscuro-sobre-claro o claro-sobre-oscuro
  //    Calculamos la media de la zona central: si es >128 el fondo es claro
  let sum=0, cnt=0;
  const mx=Math.floor(sw*0.1), my=Math.floor(sh*0.1);
  const mw=sw-2*mx, mh=sh-2*my;
  for(let y=my;y<my+mh;y++) for(let x=mx;x<mx+mw;x++){sum+=sharp[y*sw+x];cnt++;}
  const mean=sum/cnt;
  // Si fondo claro (media>140) los dígitos son oscuros → binarizar normal
  // Si fondo oscuro (media<115) los dígitos son claros → invertir resultado
  const darkOnLight = mean > 128;

  // 4. Binarización adaptativa (ventana 25px)
  const R=12;
  const integ=new Float64Array((sw+1)*(sh+1));
  for(let y=0;y<sh;y++) for(let x=0;x<sw;x++){
    integ[(y+1)*(sw+1)+(x+1)]=sharp[y*sw+x]
      +integ[y*(sw+1)+(x+1)]+integ[(y+1)*(sw+1)+x]-integ[y*(sw+1)+x];
  }
  const out=new Uint8Array(sw*sh);
  for(let y=0;y<sh;y++) for(let x=0;x<sw;x++){
    const x1=Math.max(0,x-R),y1=Math.max(0,y-R),x2=Math.min(sw-1,x+R),y2=Math.min(sh-1,y+R);
    const area=(x2-x1+1)*(y2-y1+1);
    const s=integ[(y2+1)*(sw+1)+(x2+1)]-integ[y1*(sw+1)+(x2+1)]
            -integ[(y2+1)*(sw+1)+x1]+integ[y1*(sw+1)+x1];
    const localMean=s/area;
    // pixel es texto si está suficientemente por debajo (oscuro) o encima (claro) del fondo local
    const isText = darkOnLight ? sharp[y*sw+x] < localMean - 8
                                : sharp[y*sw+x] > localMean + 8;
    out[y*sw+x] = isText ? 0 : 255;  // negro=texto, blanco=fondo para Tesseract
  }

  // 5. Escribir resultado en el canvas destino
  const od=ctx.createImageData(sw,sh);
  for(let i=0,p=0;i<od.data.length;i+=4,p++){
    od.data[i]=od.data[i+1]=od.data[i+2]=out[p]; od.data[i+3]=255;
  }
  ctx.putImageData(od,0,0);
  return dst;
}


function cropVideoCanvas(video, roi, { scaleUp=true } = {}){
  if(!roi) roi=state.scan.roi;
  const vw=video.videoWidth, vh=video.videoHeight;
  const display=getVideoSourceRect(video);
  const box={x:roi.x*video.clientWidth,y:roi.y*video.clientHeight,w:roi.w*video.clientWidth,h:roi.h*video.clientHeight};
  const ix=Math.max(box.x,display.left), iy=Math.max(box.y,display.top);
  const ax=Math.min(box.x+box.w,display.left+display.width), ay=Math.min(box.y+box.h,display.top+display.height);
  const sx=Math.max(0,Math.round((ix-display.left)/display.width*vw));
  const sy=Math.max(0,Math.round((iy-display.top)/display.height*vh));
  const sw=Math.max(1,Math.min(vw-sx,Math.round((ax-ix)/display.width*vw)));
  const sh=Math.max(1,Math.min(vh-sy,Math.round((ay-iy)/display.height*vh)));
  const scale=scaleUp ? Math.max(4,Math.min(8,3600/Math.max(sw,sh))) : 1;
  const raw=document.createElement('canvas');
  raw.width=Math.max(1,Math.round(sw*scale));
  raw.height=Math.max(1,Math.round(sh*scale));
  const rctx=raw.getContext('2d',{willReadFrequently:true});
  rctx.imageSmoothingEnabled=true; rctx.imageSmoothingQuality='high';
  rctx.drawImage(video,sx,sy,sw,sh,0,0,raw.width,raw.height);
  return raw;
}

function captureRoiCanvas(video, roi){
  return preprocessForOCR(cropVideoCanvas(video, roi));
}

/* Una sola cola: el worker de Tesseract no admite recognize en paralelo. */
let ocrQueue = Promise.resolve();
function ocrCanvas(canvas, options){
  const job = ocrQueue.then(() => ocrCanvasNow(canvas, options));
  ocrQueue = job.then(() => {}, () => {});
  return job;
}

async function ocrCanvasNow(canvas, { psmMode='6', whitelist=null } = {}){
  if(!ocrWorker || !canvas?.width || !canvas?.height) return '';
  const image = canvas.toDataURL('image/png');
  const params = { tessedit_pageseg_mode: psmMode, user_defined_dpi: '400' };
  if(whitelist) params.tessedit_char_whitelist = whitelist;
  else delete params.tessedit_char_whitelist;
  await ocrWorker.setParameters(params);
  const result = await ocrWorker.recognize(image);
  return result?.data?.text || '';
}

/* canvasGrayscaleOnly — devuelve el canvas en escala de grises SIN binarizar,
   útil como segunda pasada cuando la binarización destruye el contraste */
function canvasGrayscaleOnly(srcCanvas){
  const sw=srcCanvas.width, sh=srcCanvas.height;
  const dst=document.createElement('canvas'); dst.width=sw; dst.height=sh;
  const ctx=dst.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(srcCanvas,0,0);
  const id=ctx.getImageData(0,0,sw,sh); const d=id.data;
  for(let i=0;i<d.length;i+=4){
    const g=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);
    // Boost contraste suave (no binarizar): mapear 0-255 → expandir rango
    const v=Math.max(0,Math.min(255,Math.round((g-80)*1.8)));
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(id,0,0);
  return dst;
}

/* captureRawCanvas — captura el ROI en gris SIN binarizar */
function captureRawCanvas(video, roi){
  return canvasGrayscaleOnly(cropVideoCanvas(video, roi));
}

function nameMatchesCard(card, guess){
  const g = String(guess || '').trim().toLowerCase();
  if(g.length < 2) return false;
  const n = String(card.name || '').toLowerCase();
  return n.startsWith(g) || g.startsWith(n) || n.includes(g) || g.includes(n);
}

function breakTieBySetAndName(cards, setId, guess){
  let pool = cards;
  if(setId){
    const inSet = cards.filter(c => c.setId === setId);
    if(inSet.length) pool = inSet;
  }
  const named = pool.filter(c => nameMatchesCard(c, guess));
  if(named.length) pool = named;
  return pool.slice().sort(naturalCardSort);
}

function smartGuessName(txt){
  const cands=[];
  for(const line of String(txt || '').split('\n').map(l=>l.trim()).filter(Boolean)){
    if(/^[\d\s\/\.\-]+$/.test(line)) continue;
    const cl=line.replace(/[^A-Za-z\u00C0-\u00FF'\- ]/g,'').trim();
    if(cl.length<2||cl.length>30) continue;
    if(/^[A-Z]{1,4}\d{1,3}[a-z]?$/.test(cl)) continue;
    cands.push(cl);
  }
  if(!cands.length) return '';
  cands.sort((a,b)=>(/^[A-Z]/.test(b)?1:0)-(/^[A-Z]/.test(a)?1:0)||b.length-a.length);
  return cands[0];
}

async function settleRecognition({ numberTexts, nameText, cardColor, onStatus, missHint }){
  const fracCount = {};
  for(const t of numberTexts){
    for(const f of extractNumberFraction(t)){
      const k = f.number+'/'+f.total;
      fracCount[k] = (fracCount[k]||0)+1;
    }
  }
  let bestFrac='', bestVotes=0;
  for(const [k,v] of Object.entries(fracCount)){
    if(v>bestVotes){ bestVotes=v; bestFrac=k; }
  }
  const allNumText = numberTexts.join('\n');
  const detectedSetId = extractSetCode(allNumText);
  const fractions = extractNumberFraction(bestFrac || allNumText);
  let byNumber = [];
  if(fractions.length){
    byNumber = await matchByNumberAndSet(fractions, detectedSetId).catch(()=>[]);
  }

  const guess = smartGuessName(nameText);
  const nameLine = String(nameText || '').replace(/[^A-Za-z\u00C0-\u00FF' \-]/g,'').trim();
  let debugText = [
    bestFrac ? `Núm: ${bestFrac} (${bestVotes}/4)` : 'Núm: no detectado',
    detectedSetId ? `Set: ${detectedSetId}` : '',
    nameLine.length>1 ? `Nombre: ${nameLine.slice(0,25)}` : ''
  ].filter(Boolean).join(' · ');

  if(byNumber.length !== 1){
    const recognizer = await findRecognitionCandidates(extractRecognitionSignals(allNumText)).catch(()=>[]);
    const strong = recognizer.filter(c => c.score >= 0.86).map(c => c.card);
    if(strong.length){
      if(!byNumber.length) byNumber = strong;
      else {
        const ids = new Set(strong.map(c => c.id));
        const hit = byNumber.filter(c => ids.has(c.id));
        if(hit.length) byNumber = hit;
      }
    }
  }

  if(byNumber.length > 1) byNumber = breakTieBySetAndName(byNumber, detectedSetId, guess);

  const base = { debugText, guess, pending: null, suggestions: [], nameResults: [], message: '' };
  if(byNumber.length === 1){
    return { ...base, pending: byNumber[0], message: '¿Es esta la carta?' };
  }
  if(byNumber.length > 1){
    return { ...base, suggestions: byNumber.slice(0, 6), message: 'Varias coincidencias. ¿Cuál es?' };
  }

  let phashResults = [];
  if(cardColor){
    if(onStatus) onStatus('Comparando la imagen…');
    try{
      const globalResults = await findByPhash(cardColor, 5, 22, '');
      phashResults = globalResults;
      // El código de set solo se usa si acerca más que el catálogo completo.
      // Un código mal leído no puede tapar la carta que sí está en el marco.
      if(detectedSetId){
        const scoped = await findByPhash(cardColor, 5, 22, detectedSetId);
        if(scoped.length && (!globalResults.length || scoped[0].distance <= globalResults[0].distance)){
          phashResults = scoped;
        }
      }
    }
    catch(e){ phashResults = []; }
    if(phashResults.length){
      const best = phashResults[0];
      debugText += ` · 👁 ${best.card.name}(d=${best.distance})`;
    }
  }
  const withHash = { ...base, debugText };
  let byName = [];
  if(guess.length >= 2) byName = await searchCards(guess).catch(()=>[]);
  if(!byName.length && !phashResults.length){
    return {
      ...withHash,
      message: bestFrac
        ? `⚠️ Leí "${bestFrac}"${detectedSetId ? ' ('+detectedSetId+')' : ''} pero no está en el catálogo.`
        : (missHint || '⚠️ No pude leer el número. Incluye el código de expansión (PAR, TEF…) junto al número.'),
    };
  }
  if(phashResults.length && !byName.length){
    const best = phashResults[0];
    const next = phashResults[1];
    const gap = next ? next.distance - best.distance : 99;
    // Distancia ≤ 10 y claramente por delante de la siguiente. Si hay
    // empate, se enseña la lista: no se propone una carta dudosa.
    if(best.distance <= 10 && gap >= 4){
      return {
        ...withHash,
        pending: best.card,
        message: `👁 Reconocida visualmente (d=${best.distance}). ¿Es esta?`,
      };
    }
    return {
      ...withHash,
      nameResults: phashResults.map(r => r.card).slice(0, 6),
      message: '👁 Candidatas por imagen — ¿cuál es?',
    };
  }
  return {
    ...withHash,
    nameResults: byName.slice(0, 9),
    message: guess
      ? `No vi el número. Encontré cartas de "${guess}" — ¿es alguna de estas?`
      : 'No vi el número. Resultados por nombre:',
  };
}

async function recognizeCardSurfaces({ numberBin, numberGray, nameBin, nameGray, cardColor, onStatus, missHint }){
  const numberPasses = [
    [numberBin, '6', 'A'],
    [numberGray, '6', 'B'],
    [numberBin, '11', 'C'],
    [numberGray, '11', 'D'],
  ];
  const numberTexts = [];
  for(const [canvas, psm, label] of numberPasses){
    if(onStatus) onStatus(`Analizando número (${label})…`);
    numberTexts.push(await ocrCanvas(canvas, { psmMode: psm }));
  }
  if(onStatus) onStatus('Leyendo nombre…');
  const nameA = await ocrCanvas(nameBin, { psmMode: '7' });
  const nameB = await ocrCanvas(nameGray, { psmMode: '7' });
  const nameText = nameA.length >= nameB.length ? nameA : nameB;
  return settleRecognition({ numberTexts, nameText, cardColor, onStatus, missHint });
}

async function captureAndRecognize(){
  if(liveBusy) return;
  const video = document.getElementById('liveVideo');
  if(!video || video.readyState<2 || !video.videoWidth || !video.videoHeight || !ocrWorker){
    state.scan.liveMessage='📷 Cámara no lista. Espera un instante.'; render(); return;
  }
  liveBusy = true; state.scan.liveError = ''; state.scan.suggestions = [];
  const statusEl = document.getElementById('liveStatusText');
  try{
    const numRoi = state.scan.roiNum;
    const roi = state.scan.roi;
    const nameRoi = { x: roi.x, y: roi.y, w: roi.w, h: roi.h * 0.15 };
    const decision = await recognizeCardSurfaces({
      numberBin: captureRoiCanvas(video, numRoi),
      numberGray: captureRawCanvas(video, numRoi),
      nameBin: captureRoiCanvas(video, nameRoi),
      nameGray: captureRawCanvas(video, nameRoi),
      cardColor: cropVideoCanvas(video, roi, { scaleUp: false }),
      onStatus: (text) => { if(statusEl) statusEl.textContent = text; },
      missHint: '⚠️ No pude leer el número. Centra el recuadro amarillo sobre "128/182" incluyendo el código antes (PAR/TEF…).',
    });
    state.scan.liveText = decision.debugText;
    state.scan.pendingConfirm = decision.pending;
    state.scan.suggestions = decision.suggestions;
    state.scan.nameResults = decision.nameResults;
    state.scan.liveMessage = decision.message || 'No encontré una carta. Ajusta los recuadros e inténtalo de nuevo.';
    render();
  }catch(e){
    console.error(e);
    state.scan.liveError=e?.message||String(e);
    state.scan.liveMessage='⚠️ Error. Inténtalo de nuevo.';
    render();
  }finally{ liveBusy=false; }
}


function addScannedCard(card, lockMs=3000){
  addCardToCollection(card);
  state.scan.recent.unshift(card);
  state.scan.recent=state.scan.recent.slice(0,6);
  state.scan.cooldownUntil=Date.now()+lockMs;
  state.scan.suggestions=[];
  render();
  queueLiveRecognitionFrame(lockMs);
}

/* ---------- acciones de colección ---------- */
function addCardToCollection(card){
  if(!fitsPlan(albumCardCount(state.collection) + 1)){
    showToast(planLimitMessage());
    return;
  }
  const existing = state.collection.find(c => c.id === card.id);
  if(existing){
    existing.qty += 1;
  }else{
    state.collection.push({ ...card, qty: 1 });
  }
  saveCollection();
  showToast(`${card.name} añadida al álbum`);
}
function changeQty(id, delta){
  const item = state.collection.find(c => c.id === id);
  if(!item) return;
  if(delta > 0 && !fitsPlan(albumCardCount(state.collection) + delta)){
    showToast(planLimitMessage());
    return;
  }
  item.qty += delta;
  if(item.qty <= 0){
    state.collection = state.collection.filter(c => c.id !== id);
  }
  saveCollection();
  render();
}
function removeCard(id){
  const item = state.collection.find(c => c.id === id);
  if(!item) return;
  if(item.qty > 1 && !window.confirm(`Quitar las ${item.qty} copias de ${item.name}`)) return;
  state.collection = state.collection.filter(c => c.id !== id);
  saveCollection();
  render();
}

function accountUser(){
  return window.Clerk && window.Clerk.loaded && window.Clerk.user ? window.Clerk.user : null;
}

function formatPlanEnd(iso){
  const date = new Date(iso);
  if(Number.isNaN(date.getTime())) return '';
  return new Intl.DateTimeFormat('es', { dateStyle: 'long' }).format(date);
}

function clerkErrorText(err){
  const first = err && Array.isArray(err.errors) ? err.errors[0] : null;
  const text = first && (first.longMessage || first.message);
  if(text) return String(text);
  if(err && err.message) return String(err.message);
  return 'No se pudieron guardar los datos.';
}

function ensureAccountDraft(){
  const user = accountUser();
  if(!user) return;
  if(state.account.touched && state.account.userId === user.id) return;
  state.account.userId = user.id;
  state.account.firstName = user.firstName || '';
  state.account.lastName = user.lastName || '';
  const primary = user.primaryEmailAddress;
  state.account.email = primary && primary.emailAddress ? primary.emailAddress : '';
}

async function saveAccountProfile(){
  const user = accountUser();
  if(!user || typeof user.update !== 'function'){
    state.account.status = 'error';
    state.account.errorField = 'name';
    state.account.message = 'La sesión no está lista. Vuelve a entrar.';
    render();
    return;
  }
  state.account.status = 'saving';
  state.account.message = '';
  render();
  try{
    await user.update({
      firstName: state.account.firstName.trim(),
      lastName: state.account.lastName.trim(),
    });
  }catch(err){
    console.error(err);
    state.account.status = 'error';
    state.account.errorField = 'name';
    state.account.message = clerkErrorText(err);
    render();
    return;
  }
  const current = user.primaryEmailAddress && user.primaryEmailAddress.emailAddress
    ? user.primaryEmailAddress.emailAddress
    : '';
  const next = state.account.email.trim();
  if(next && next.toLowerCase() !== current.toLowerCase()){
    try{
      if(typeof user.createEmailAddress !== 'function') throw new Error('Esta cuenta no permite cambiar el correo desde aquí.');
      const created = await user.createEmailAddress({ email: next });
      await created.prepareVerification({ strategy: 'email_code' });
      state.account.pendingEmailId = created.id;
      state.account.code = '';
      state.account.status = 'code';
      state.account.message = 'El nombre ya está guardado. Escribe el código que enviamos a ' + next + '.';
      render();
      return;
    }catch(err){
      console.error(err);
      state.account.status = 'error';
      state.account.errorField = 'email';
      state.account.message = 'El nombre se guardó. El correo no: ' + clerkErrorText(err);
      render();
      return;
    }
  }
  if(typeof user.reload === 'function') await user.reload().catch(()=>{});
  state.account.touched = false;
  state.account.errorField = '';
  state.account.status = 'saved';
  state.account.message = 'Datos guardados.';
  ensureAccountDraft();
  render();
}

async function confirmAccountEmail(){
  const user = accountUser();
  const email = user && Array.isArray(user.emailAddresses)
    ? user.emailAddresses.find(item => item.id === state.account.pendingEmailId)
    : null;
  if(!email || typeof email.attemptVerification !== 'function'){
    state.account.status = 'error';
    state.account.message = 'Ese código ya no sirve. Vuelve a guardar el correo.';
    state.account.pendingEmailId = '';
    render();
    return;
  }
  state.account.status = 'saving';
  state.account.message = '';
  render();
  try{
    await email.attemptVerification({ code: state.account.code.trim() });
    await user.update({ primaryEmailAddressId: email.id });
    if(typeof user.reload === 'function') await user.reload().catch(()=>{});
    state.account.pendingEmailId = '';
    state.account.code = '';
    state.account.touched = false;
    state.account.status = 'saved';
    state.account.message = 'Correo actualizado.';
    ensureAccountDraft();
  }catch(err){
    console.error(err);
    state.account.status = 'error';
    state.account.message = clerkErrorText(err);
  }
  render();
}

async function redeemPlanCode(){
  if(!accountUser()) return;
  const raw = state.account.redeemCode.trim();
  if(!raw){
    state.account.redeemStatus = 'error';
    state.account.redeemMessage = 'Escribe el código.';
    render();
    return;
  }
  if(!albumConfig().apiBase){
    state.account.redeemStatus = 'error';
    state.account.redeemMessage = 'No hay conexión con la cuenta.';
    render();
    return;
  }
  state.account.redeemStatus = 'saving';
  state.account.redeemMessage = '';
  render();
  try{
    const token = await sessionToken();
    if(!token) throw new Error('La sesión no está lista. Vuelve a entrar.');
    const res = await fetch(albumConfig().apiBase + '/api/redeem', {
      method: 'POST',
      headers: {
        Authorization: 'Bearer ' + token,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ code: raw }),
    });
    let data = null;
    try{ data = await res.json(); }catch(e){ data = null; }
    if(!res.ok) throw new Error(data && data.error ? String(data.error) : 'No se pudo canjear el código.');
    rememberAccount(data);
    state.account.redeemCode = '';
    state.account.redeemStatus = 'saved';
    const name = data && data.plan && data.plan.name ? data.plan.name : 'nuevo';
    const when = data && data.planExpiresAt ? formatPlanEnd(data.planExpiresAt) : '';
    state.account.redeemMessage = when ? `Plan ${name} activo hasta el ${when}.` : `Plan ${name} activo.`;
  }catch(err){
    console.error(err);
    state.account.redeemStatus = 'error';
    state.account.redeemMessage = err && err.message ? err.message : 'No se pudo canjear el código.';
  }
  render();
}

function updateHeader(){
  const total = state.collection.reduce((n,c)=> n + c.qty, 0);
  document.getElementById('collectionCount').textContent = `${total} ${total===1?'carta':'cartas'}`;
  const totalEUR = state.collection.reduce((s,c)=> s + (c.cardmarketEUR||0)*c.qty, 0);
  const totalUSD = state.collection.reduce((s,c)=> s + (c.tcgplayerUSD||0)*c.qty, 0);
  document.getElementById('totalEUR').textContent = `€${totalEUR.toFixed(2)}`;
  document.getElementById('totalUSD').textContent = `$${totalUSD.toFixed(2)}`;
}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab);
  });
  if(state.tab === 'scan') renderScanTab();
  else if(state.tab === 'search') renderSearchTab();
  else if(state.tab === 'expansion') renderExpansionTab();
  else if(state.tab === 'account') renderAccountTab();
  else renderCollectionTab();
  updateHeader();
  attachDynamicListeners();
  if(state.tab === 'scan' && state.scan.mode === 'live' && state.scan.liveActive){
    const video = document.getElementById('liveVideo');
    bindLivePreview(video);
  }
}

/* ---------- listeners dinámicos (regenerados en cada render) ---------- */
function attachDynamicListeners(){
  const accountSignIn = document.getElementById('accountSignIn');
  if(accountSignIn) accountSignIn.addEventListener('click', onSignInClick);
  ['accountFirst','accountLast','accountEmail','accountCode'].forEach((id) => {
    const el = document.getElementById(id);
    if(!el) return;
    const key = { accountFirst:'firstName', accountLast:'lastName', accountEmail:'email', accountCode:'code' }[id];
    el.addEventListener('input', () => {
      state.account[key] = el.value;
      state.account.touched = true;
    });
  });
  const accountSave = document.getElementById('accountSave');
  if(accountSave) accountSave.addEventListener('click', () => saveAccountProfile());
  const accountConfirm = document.getElementById('accountConfirmEmail');
  if(accountConfirm) accountConfirm.addEventListener('click', () => confirmAccountEmail());
  const redeemInput = document.getElementById('redeemCode');
  if(redeemInput){
    redeemInput.addEventListener('input', () => {
      state.account.redeemCode = redeemInput.value;
    });
    redeemInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter') redeemPlanCode();
    });
  }
  const redeemPlan = document.getElementById('redeemPlan');
  if(redeemPlan) redeemPlan.addEventListener('click', () => redeemPlanCode());
  document.querySelectorAll('.chip[data-mode]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(state.scan.mode === el.dataset.mode) return;
      if(state.scan.liveActive) stopLiveScan();
      state.scan.mode = el.dataset.mode;
      render();
    });
  });
  const startLiveBtn = document.getElementById('startLiveBtn');
  if(startLiveBtn){
    startLiveBtn.addEventListener('click', ()=> startLiveScan());
  }
  const beginScanBtn = document.getElementById('beginScanBtn');
  if(beginScanBtn){
    beginScanBtn.addEventListener('click', ()=> beginLiveRecognition());
  }
  const captureAgainBtn = document.getElementById('captureAgainBtn');
  if(captureAgainBtn){
    captureAgainBtn.addEventListener('click', ()=> captureAndRecognize());
  }
  const adjustAgainBtn = document.getElementById('adjustAgainBtn');
  if(adjustAgainBtn){
    adjustAgainBtn.addEventListener('click', ()=> resetToAdjust());
  }
  const stopLiveBtn = document.getElementById('stopLiveBtn');
  if(stopLiveBtn){
    stopLiveBtn.addEventListener('click', ()=>{ stopLiveScan(); render(); });
  }
  const zoomRange = document.getElementById('zoomRange');
  if(zoomRange){
    zoomRange.addEventListener('input', ()=> applyCameraZoom(zoomRange.value));
  }
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  if(zoomOutBtn){
    zoomOutBtn.addEventListener('click', ()=> applyCameraZoom((state.scan.zoom || 1) - (state.scan.zoomStep || 0.1)));
  }
  const zoomInBtn = document.getElementById('zoomInBtn');
  if(zoomInBtn){
    zoomInBtn.addEventListener('click', ()=> applyCameraZoom((state.scan.zoom || 1) + (state.scan.zoomStep || 0.1)));
  }
  const resetZoomBtn = document.getElementById('resetZoomBtn');
  if(resetZoomBtn){
    resetZoomBtn.addEventListener('click', ()=> applyCameraZoom(state.scan.zoomMin || 1));
  }
  document.querySelectorAll('[data-suggest-idx]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const card = state.scan.suggestions[parseInt(el.dataset.suggestIdx,10)];
      if(!card) return;
      addScannedCard(card, 6000);
    });
  });

  const confirmYesBtn = document.getElementById('confirmYesBtn');
  if(confirmYesBtn){
    confirmYesBtn.addEventListener('click', ()=>{
      if(state.scan.pendingConfirm){
        addScannedCard(state.scan.pendingConfirm, 3000);
        state.scan.pendingConfirm = null;
      }
    });
  }
  const confirmNoBtn = document.getElementById('confirmNoBtn');
  if(confirmNoBtn){
    confirmNoBtn.addEventListener('click', ()=>{
      state.scan.pendingConfirm = null;
      state.scan.liveMessage = 'De acuerdo. Ajusta el recuadro e inténtalo de nuevo.';
      render();
    });
  }
  const suggestLeadYes = document.getElementById('suggestLeadYes');
  if(suggestLeadYes) suggestLeadYes.addEventListener('click', ()=>{
    const card = state.scan.suggestions[0];
    if(card) addScannedCard(card, 6000);
  });
  const suggestLeadNo = document.getElementById('suggestLeadNo');
  if(suggestLeadNo) suggestLeadNo.addEventListener('click', ()=>{
    state.scan.suggestions = state.scan.suggestions.slice(1);
    render();
  });
  const nameLeadYes = document.getElementById('nameLeadYes');
  if(nameLeadYes) nameLeadYes.addEventListener('click', ()=>{
    const card = state.scan.nameResults[0];
    if(card) addScannedCard(card, 6000);
  });
  const nameLeadNo = document.getElementById('nameLeadNo');
  if(nameLeadNo) nameLeadNo.addEventListener('click', ()=>{
    state.scan.nameResults = state.scan.nameResults.slice(1);
    render();
  });
  const guideToggle = document.getElementById('guideToggle');
  if(guideToggle) guideToggle.addEventListener('click', ()=>{
    state.scan.guideOpen = !state.scan.guideOpen;
    render();
  });

  document.querySelectorAll('[data-name-idx]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const card = state.scan.nameResults[parseInt(el.dataset.nameIdx,10)];
      if(!card) return;
      addScannedCard(card, 6000);
    });
  });

  const fileInput = document.getElementById('fileInput');
  if(fileInput){
    fileInput.addEventListener('change', onFileSelected);
  }
  const guessInput = document.getElementById('guessInput');
  if(guessInput){
    guessInput.addEventListener('input', (e)=>{ state.scan.photo.guess = e.target.value; });
    guessInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') doScanSearch(); });
  }
  const scanSearchBtn = document.getElementById('scanSearchBtn');
  if(scanSearchBtn){
    scanSearchBtn.addEventListener('click', ()=> doScanSearch());
  }
  const photoLeadYes = document.getElementById('photoLeadYes');
  if(photoLeadYes) photoLeadYes.addEventListener('click', ()=>{
    const card = state.scan.photo.results[0];
    if(card) addCardToCollection(card);
  });
  const photoLeadNo = document.getElementById('photoLeadNo');
  if(photoLeadNo) photoLeadNo.addEventListener('click', ()=>{
    state.scan.photo.results = state.scan.photo.results.slice(1);
    render();
  });
  const scanResults = document.getElementById('scanResults');
  if(scanResults){
    scanResults.querySelectorAll('[data-add-idx]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const card = state.scan.photo.results[parseInt(el.dataset.addIdx,10)];
        addCardToCollection(card);
      });
    });
  }
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{
      state.search.query = e.target.value;
      clearTimeout(state.search.timer);
      state.search.timer = setTimeout(()=> doSearch(), 280);
    });
    searchInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        clearTimeout(state.search.timer);
        doSearch();
      }
    });
  }
  const searchRetry = document.getElementById('searchRetry');
  if(searchRetry) searchRetry.addEventListener('click', ()=> doSearch());
  const searchResults = document.getElementById('searchResults');
  if(searchResults){
    searchResults.querySelectorAll('[data-add-idx]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const card = state.search.results[parseInt(el.dataset.addIdx,10)];
        addCardToCollection(card);
      });
    });
  }
  document.querySelectorAll('.chip[data-sort]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.sortMode = el.dataset.sort; render(); });
  });
  const collectionQuery = document.getElementById('collectionQuery');
  if(collectionQuery){
    collectionQuery.addEventListener('input', ()=>{
      state.collectionQuery = collectionQuery.value;
      renderKeeping('collectionQuery');
    });
  }
  const retryCollection = document.getElementById('retryCollection');
  if(retryCollection) retryCollection.addEventListener('click', ()=> loadCollection().then(()=> render()));
  const goScan = document.getElementById('goScan');
  if(goScan) goScan.addEventListener('click', ()=>{ state.tab = 'scan'; render(); });
  document.querySelectorAll('[data-qty]').forEach(el=>{
    el.addEventListener('click', ()=> changeQty(el.dataset.id, parseInt(el.dataset.qty,10)));
  });
  document.querySelectorAll('[data-remove]').forEach(el=>{
    el.addEventListener('click', ()=> removeCard(el.dataset.remove));
  });

  document.querySelectorAll('.set-row[data-set-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const set = state.expansion.sets.find(s => s.id === el.dataset.setId);
      if(set) openSet(set);
    });
  });
  const retryLoadSets = document.getElementById('retryLoadSets');
  if(retryLoadSets){
    retryLoadSets.addEventListener('click', ()=> loadSets());
  }
  const setQuery = document.getElementById('setQuery');
  if(setQuery){
    setQuery.addEventListener('input', ()=>{
      state.expansion.query = setQuery.value;
      renderKeeping('setQuery');
    });
  }
  const refreshSets = document.getElementById('refreshSets');
  if(refreshSets){
    refreshSets.addEventListener('click', ()=> refreshSetsCatalog());
  }
  const expBackBtn = document.getElementById('expBackBtn');
  if(expBackBtn){
    expBackBtn.addEventListener('click', ()=>{
      state.expansion.view = 'sets';
      state.expansion.selectedSet = null;
      render();
    });
  }
  const retryLoadCards = document.getElementById('retryLoadCards');
  if(retryLoadCards){
    retryLoadCards.addEventListener('click', ()=> openSet(state.expansion.selectedSet));
  }
  document.querySelectorAll('.chip[data-expfilter]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.expansion.filter = el.dataset.expfilter; render(); });
  });
  document.querySelectorAll('.check-card[data-card-id]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const card = state.expansion.cards.find(c => c.id === el.dataset.cardId);
      if(!card) return;
      addCardToCollection(card);
      render();
    });
  });
  document.querySelectorAll('[data-minus-id]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      changeQty(el.dataset.minusId, -1);
    });
  });
  const exportBtn = document.getElementById('exportCollectionBtn');
  if(exportBtn){
    exportBtn.addEventListener('click', exportCollection);
  }
  const importInput = document.getElementById('importCollectionInput');
  if(importInput){
    importInput.addEventListener('change', importCollection);
  }
}

/* ---------- flujos async ---------- */
async function onFileSelected(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await resizeImage(file);
    state.scan.photo = { image: dataUrl, status: 'ocr', guess: '', results: [], detail: 'Preparando el motor de lectura…' };
    render();
    await ensureOcrWorker();
    const full = await loadCanvasFromDataUrl(dataUrl);
    const numberColor = cropRatioCanvas(full, 0, 0.78, 0.92, 0.2, { scaleUp: true });
    const nameColor = cropRatioCanvas(full, 0, 0, 1, 0.15, { scaleUp: true });
    const decision = await recognizeCardSurfaces({
      numberBin: preprocessForOCR(numberColor),
      numberGray: canvasGrayscaleOnly(numberColor),
      nameBin: preprocessForOCR(nameColor),
      nameGray: canvasGrayscaleOnly(nameColor),
      cardColor: full,
      onStatus: (text) => {
        state.scan.photo.detail = text;
        const el = document.getElementById('photoStatusText');
        if(el) el.textContent = text;
      },
      missHint: '⚠️ No pude leer el número. La foto debe mostrar la carta entera, con el código (PAR, TEF…) y el número abajo a la izquierda.',
    });
    state.scan.photo.guess = decision.guess || '';
    state.scan.photo.detail = [decision.debugText, decision.message].filter(Boolean).join(' — ');
    state.scan.photo.results = decision.pending
      ? [decision.pending]
      : (decision.suggestions.length ? decision.suggestions : decision.nameResults);
    state.scan.photo.status = 'done';
    render();
  }catch(err){
    console.error(err);
    state.scan.photo.status = 'error';
    render();
  }
}

async function doScanSearch(){
  const name = state.scan.photo.guess;
  if(!name.trim()) return;
  state.scan.photo.status = 'searching';
  state.scan.photo.results = [];
  render();
  try{
    state.scan.photo.results = await searchCards(name);
  }catch(err){
    console.error(err);
  }
  state.scan.photo.status = 'done';
  render();
}

let searchToken = 0;
async function doSearch(){
  const q = state.search.query.trim();
  const token = ++searchToken;
  if(q.length < 2){
    state.search.results = [];
    state.search.status = 'idle';
    renderKeeping('searchInput');
    return;
  }
  state.search.status = 'searching';
  renderKeeping('searchInput');
  try{
    const results = await searchCards(q);
    if(token !== searchToken) return;
    state.search.results = results;
    state.search.status = 'done';
  }catch(err){
    console.error(err);
    if(token !== searchToken) return;
    state.search.status = 'error';
  }
  renderKeeping('searchInput');
}

async function refreshSetsCatalog(){
  state.expansion.sets = null;
  await loadSets();
}

async function loadSets(){
  state.expansion.setsStatus = 'loading';
  state.expansion.setsError = '';
  render();
  try{
    const sets = await fetchAllSets();
    sets.sort((a,b)=> (b.order||0) - (a.order||0));
    state.expansion.sets = sets;
    state.expansion.setsStatus = 'done';
  }catch(err){
    console.error(err);
    state.expansion.setsError = err.message || 'Error desconocido';
    state.expansion.setsStatus = 'error';
  }
  render();
}

async function openSet(set){
  state.expansion.selectedSet = set;
  state.expansion.view = 'cards';
  state.expansion.filter = 'all';
  state.expansion.cardsError = '';
  if(state.expansion.cardsCache[set.id]){
    state.expansion.cards = state.expansion.cardsCache[set.id];
    state.expansion.cardsStatus = 'done';
    render();
    return;
  }
  state.expansion.cards = [];
  state.expansion.cardsStatus = 'loading';
  render();
  try{
    const cards = await fetchSetCards(set);
    cards.sort(naturalCardSort);
    state.expansion.cardsCache[set.id] = cards;
    state.expansion.cards = cards;
    state.expansion.cardsStatus = 'done';
  }catch(err){
    console.error(err);
    state.expansion.cardsError = err.message || 'Error desconocido';
    state.expansion.cardsStatus = 'error';
  }
  render();
}

/* ---------- navegación de pestañas ---------- */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.dataset.tab !== 'scan' && state.scan.liveActive) stopLiveScan();
    state.tab = btn.dataset.tab;
    render();
    if(state.tab === 'expansion' && state.expansion.sets === null && state.expansion.setsStatus === 'idle'){
      loadSets();
    }
  });
});

function scrubClientText(value){
  return String(value || '')
    .replace(/data:image\/[a-z0-9.+-]+;base64,[a-z0-9+/=]+/gi, '[imagen]')
    .replace(/__clerk_db_jwt=[^&\s#]+/gi, '__clerk_db_jwt=[omitido]')
    .replace(/\bBearer\s+[A-Za-z0-9._\-]+/gi, 'Bearer [omitido]')
    .replace(/\b(?:sk|pk)_(?:test|live)_[A-Za-z0-9]+\b/g, '[clave]')
    .replace(/mongodb(?:\+srv)?:\/\/\S+/gi, 'mongodb://[omitido]')
    .replace(/\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b/g, '[jwt]')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 800);
}

function reportClientError(err, source){
  const now = Date.now();
  if(now - lastClientReport < 2000) return;
  const message = scrubClientText(err && err.message ? err.message : err);
  if(!message) return;
  const base = albumConfig().apiBase;
  if(!base) return;
  lastClientReport = now;
  const headers = { 'Content-Type': 'application/json' };
  sessionToken().then((token) => {
    if(token) headers.Authorization = 'Bearer ' + token;
    return fetch(base + '/api/client-errors', {
      method: 'POST',
      headers,
      body: JSON.stringify({
        message,
        source: source || 'cliente',
        stack: scrubClientText(err && err.stack).slice(0, 1200),
        path: location.pathname,
      }),
    });
  }).catch(() => {});
}

window.addEventListener('error', (event) => {
  reportClientError(event.error || event.message || 'error', 'ventana');
});
window.addEventListener('unhandledrejection', (event) => {
  reportClientError(event.reason || 'promesa', 'promesa');
});

/* ---------- init ---------- */
(async function init(){
  await loadOptionalScript('./config.local.js');
  await setupAuth();
  await loadCollection();
  render();
  ensureGlobalIndex().catch(err=> console.error('No se pudo precargar el índice de cartas', err));
  ensurePhash().catch(()=>{});  // precargar phash.json en segundo plano (falla silenciosamente si no existe)
  if(state.expansion.sets === null && state.expansion.setsStatus === 'idle'){
    loadSets();
  }
})();
</script>
