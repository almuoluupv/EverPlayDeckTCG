<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mi Álbum Pokémon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.5/tesseract.min.js"></script>
<style>
  :root{
    --ink:#14171F;
    --surface:#1B1F2B;
    --surface-2:#242A3A;
    --line: rgba(241,239,233,0.08);
    --accent:#F5C518;
    --accent-ink:#3A2E00;
    --teal:#2FB9C4;
    --text:#F1EFE9;
    --muted:#8B90A0;
    --danger:#E4572E;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;touch-action:pan-x pan-y;}
  body{
    background: var(--ink);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  #app{
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(245,197,24,0.10), transparent 60%),
      var(--ink);
  }

  header.topbar{
    padding: 22px 20px 16px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    border-bottom: 1px solid var(--line);
  }
  header.topbar h1{
    font-family:'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing: -0.01em;
  }
  header.topbar .sub{
    color: var(--muted);
    font-size: 13px;
  }
  .totals{
    text-align:right;
    font-family:'Space Grotesk', sans-serif;
  }
  .totals .val{ font-size:18px; font-weight:700; line-height:1.25;}
  .totals .val.eur{ color: var(--accent); }
  .totals .val.usd{ color: var(--teal); }
  .auth-slot{ margin-top: 8px; min-height: 22px; display:flex; flex-direction:column; align-items:flex-start; gap:4px; }
  .auth-note{ color: var(--muted); font-size: 11.5px; line-height: 1.3; }
  a.admin-link{ color: var(--teal); font-size: 11.5px; }
  .auth-btn{
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(245,197,24,0.45);
    border-radius: 999px;
    padding: 4px 10px;
    font: 600 12px 'Inter', sans-serif;
    cursor: pointer;
  }

  main{
    flex:1;
    padding: 18px 16px calc(100px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }

  nav.tabs{
    position: sticky;
    bottom: 0;
    display:flex;
    background: var(--surface);
    border-top: 1px solid var(--line);
    max-width:520px;
    margin: 0 auto;
    width:100%;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs button{
    flex:1 1 0;
    min-width:0;
    background:none;
    border:none;
    color: var(--muted);
    font-family:'Inter', sans-serif;
    font-size: 12px;
    font-weight:600;
    padding: 10px 2px 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
    cursor:pointer;
  }
  nav.tabs button svg{ width:22px; height:22px; }
  nav.tabs button.active{ color: var(--accent); }
  nav.tabs button.active svg{ stroke: var(--accent); }

  .card-box{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    border-radius: 10px;
    padding: 13px 18px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14.5px;
    cursor:pointer;
  }
  .btn-primary{ background: var(--accent); color: var(--accent-ink); width:100%; }
  .btn-primary:active{ transform: translateY(1px); }
  .btn-ghost{ background: var(--surface-2); color: var(--text); border:1px solid var(--line); }

  input[type="text"], input[type="email"]{
    width:100%;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 16px;
    font-family:'Inter', sans-serif;
  }
  input[type="text"]::placeholder, input[type="email"]::placeholder{ color: var(--muted); }
  .field-label{ display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
  .plan-meter{ height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden; margin:10px 0 6px; }
  .plan-meter span{ display:block; height:100%; background:var(--accent); }
  .account-note{ font-size:13.5px; line-height:1.45; color:var(--muted); margin:8px 0 0; }
  .account-note.bad{ color:var(--danger); }
  .account-note.ok{ color:var(--teal); }
  input.code-input{ letter-spacing:0.08em; text-transform:uppercase; font-weight:600; }
  input[type="file"]{ display:none; }

  h2.section-title{
    font-family:'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight:600;
    margin: 22px 0 10px;
    color: var(--text);
  }
  h2.section-title:first-child{ margin-top:0; }

  .hint{ color: var(--muted); font-size: 13px; line-height:1.5; margin-top:10px; }

  .preview-wrap{
    display:flex;
    gap:14px;
    align-items:center;
    margin-bottom: 14px;
  }
  .preview-wrap img{
    width: 78px; height:109px; object-fit:cover; border-radius:8px; border:1px solid var(--line);
  }
  .status-line{ font-size: 13.5px; color: var(--muted); display:flex; align-items:center; gap:8px; }
  .spinner{
    width:14px; height:14px; border-radius:50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .result-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 14px;
  }
  .result-card{
    background: var(--surface-2);
    border:1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    cursor:pointer;
    text-align:center;
  }
  .result-card:active{ border-color: var(--accent); }
  .result-card img{ width:100%; border-radius:6px; display:block; margin-bottom:6px; }
  .result-card .rname{ font-size:11.5px; font-weight:600; line-height:1.25; }
  .result-card .rset{ font-size:10.5px; color: var(--muted); margin-top:2px; }

  .empty{
    text-align:center;
    padding: 50px 20px;
    color: var(--muted);
  }
  .empty svg{ width:44px; height:44px; stroke: var(--muted); margin-bottom:14px; }
  .empty p{ font-size:14px; line-height:1.5; margin:0; }

  .sort-row{
    display:flex; gap:8px; margin-bottom: 16px;
  }
  .chip{
    flex:1;
    text-align:center;
    padding: 9px 6px;
    border-radius: 8px;
    background: var(--surface-2);
    border:1px solid var(--line);
    font-size: 12.5px;
    font-weight:600;
    color: var(--muted);
    cursor:pointer;
  }
  .chip.active{ background: rgba(245,197,24,0.12); border-color: var(--accent); color: var(--accent); }

  .group-header{
    display:flex; justify-content:space-between; align-items:baseline;
    margin: 20px 0 8px;
  }
  .group-header:first-child{ margin-top:0; }
  .group-header .gname{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14.5px; }
  .group-header .gcount{ color: var(--muted); font-size:12px; }

  .row{
    display:flex; gap:12px; align-items:center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child{ border-bottom:none; }
  .row img{ width:46px; height:64px; object-fit:cover; border-radius:5px; flex-shrink:0; }
  .row .info{ flex:1; min-width:0; }
  .row .rname{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .rmeta{ font-size:11.5px; color: var(--muted); margin-top:2px; }
  .row .prices{ font-size:12px; margin-top:4px; display:flex; gap:10px; }
  .row .prices .p-eur{ color: var(--accent); font-weight:600; }
  .row .prices .p-usd{ color: var(--teal); font-weight:600; }
  .row .qty{
    display:flex; align-items:center; gap:6px; flex-shrink:0;
  }
  .qty button{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--line);
    background: var(--surface-2); color: var(--text); font-size:18px; cursor:pointer; line-height:1;
  }
  .qty .n{ font-size:13px; font-weight:600; min-width:16px; text-align:center; }
  .del{
    background:var(--surface-2); border:1px solid var(--line); color: var(--muted);
    min-width:44px; height:44px; border-radius:10px; font-size: 16px; cursor:pointer; padding: 0 10px;
  }
  .del-word{ display:none; }
  .prices{ flex-wrap:wrap; }

  .toast{
    position: fixed;
    bottom: calc(78px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface-2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight:500;
    z-index: 50;
    opacity: 0;
    pointer-events:none;
    transition: opacity 0.25s ease;
  }
  .toast.show{ opacity: 1; }

  .mode-row{ display:flex; gap:8px; margin-bottom: 14px; }

  .video-box{ padding: 14px; }
  .video-wrap{
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 10px;
    overflow: hidden;
    background: #000;
  }
  .video-wrap video{
    width:100%; height:100%; object-fit:cover; object-position:center center; display:block;
  }
  .camera-adjust{
    margin-top:12px; padding:12px; border:1px solid var(--border);
    border-radius:12px; background:var(--surface-2);
  }
  .zoom-row{display:flex;align-items:center;gap:10px;}
  .zoom-btn{width:42px;height:42px;padding:0;font-size:22px;border-radius:10px;}
  .zoom-range{flex:1;accent-color:var(--accent);min-width:0;}
  .zoom-value{min-width:54px;text-align:center;font-weight:700;font-size:14px;}
  .camera-adjust small{display:block;color:var(--muted);line-height:1.4;margin-top:7px;}
  .adjust-actions{display:flex;gap:8px;margin-top:10px;}
  .adjust-actions .btn{flex:1; width:auto; min-height:44px;}
  /* ── Encuadre azul: carta completa ── */
  .roi-card{position:absolute;border:2.5px solid #4a9eff;border-radius:10px;background:rgba(74,158,255,.04);box-shadow:0 0 0 2px rgba(0,0,0,.3);cursor:move;touch-action:none;z-index:3;pointer-events:auto;}
  /* Badge en esquina superior-izquierda, pequeño, no tapa nada importante */
  .roi-card::before{content:'CARTA';position:absolute;top:4px;left:4px;background:rgba(0,0,0,.72);color:#4a9eff;padding:2px 6px;border-radius:4px;font-size:8px;font-weight:800;letter-spacing:.06em;pointer-events:none;white-space:nowrap;}
  /* ── Encuadre amarillo: número ── */
  .roi-num{position:absolute;border:2.5px solid var(--accent);border-radius:7px;background:rgba(245,197,24,.12);box-shadow:0 0 0 2px rgba(0,0,0,.3);cursor:move;touch-action:none;z-index:4;pointer-events:auto;min-width:48px;min-height:24px;}
  /* Badge DEBAJO del recuadro amarillo para no tapar el número */
  .roi-num::before{content:'NÚMERO';position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:var(--accent);padding:2px 7px;border-radius:5px;font-size:9px;font-weight:800;letter-spacing:.08em;pointer-events:none;white-space:nowrap;}
  /* Esquina redimensionable del recuadro amarillo */
  .roi-num-resize{position:absolute;bottom:0;right:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:var(--accent);border-radius:4px 0 4px 0;opacity:.85;display:flex;align-items:center;justify-content:center;}
  .roi-num-resize::after{content:'◢';font-size:9px;color:#000;line-height:1;}
  /* Leyenda de instrucciones */
  .roi-legend{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .roi-legend-card{color:#4a9eff;}.roi-legend-num{color:var(--accent);}
  /* debug text — FUERA del video, debajo del recuadro */
  .ocr-debug{font-size:11px;color:var(--muted);padding:5px 4px 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .capture-actions{display:flex;gap:8px;margin-top:8px}.capture-actions .btn{flex:1}
  /* Status — FUERA del video-wrap, no superpuesto */
  .live-status{
    display:flex; align-items:center; gap:7px;
    font-size:12px; font-weight:600; color:var(--text);
    padding:6px 4px; margin-top:4px;
  }
  .live-status .dot{
    flex-shrink:0;width:7px; height:7px; border-radius:50%; background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:0.3;} }
  .suggest-banner{
    position:absolute; left:0; right:0; bottom:0;
    background: rgba(20,23,31,0.92);
    padding: 10px 10px 12px;
  }
  .suggest-label{ font-size:11.5px; color: var(--muted); margin-bottom:6px; }
  .suggest-list{ display:flex; gap:8px; overflow-x:auto; }
  .suggest-item{
    flex-shrink:0; width:64px; text-align:center; cursor:pointer;
  }
  .suggest-item img{ width:100%; border-radius:6px; border:1px solid var(--line); }
  .suggest-item span{ display:block; font-size:10px; margin-top:3px; line-height:1.2; color: var(--text); }

  /* ── Confirmación de carta única ── */
  .confirm-banner{
    display:flex; align-items:center; gap:12px;
    background:var(--card); border:2px solid var(--accent);
    border-radius:12px; padding:12px; margin:10px 0;
  }
  .confirm-banner img{ width:72px; border-radius:8px; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,.25); }
  .confirm-info{ flex:1; min-width:0; }
  .confirm-info strong{ display:block; font-size:15px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .confirm-info span{ font-size:11px; color:var(--muted); }
  .confirm-info .confirm-price{ font-size:12px; color:var(--accent); font-weight:600; margin-top:3px; }
  .confirm-actions{ display:flex; flex-direction:row; gap:8px; flex-wrap:wrap; }
  .confirm-actions .btn{ padding:12px 14px; font-size:14.5px; white-space:nowrap; width:auto; flex:1; min-height:44px; }
  .name-results-header{ font-size:13px; font-weight:600; color:var(--text); margin:12px 0 8px; }
  .name-results-header span{ font-size:11px; font-weight:400; color:var(--muted); margin-left:6px; }
  .name-results-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px; }
  .name-result-item{ cursor:pointer; background:var(--card); border:1.5px solid var(--line); border-radius:10px; padding:7px; text-align:center; transition:border-color .15s; }
  .name-result-item:active{ border-color:var(--accent); }
  .name-result-item img{ width:100%; border-radius:6px; display:block; margin-bottom:5px; }
  .name-result-item .nri-name{ font-size:10px; font-weight:700; color:var(--text); line-height:1.2; }
  .name-result-item .nri-set{ font-size:12px; color:var(--muted); margin-top:2px; line-height:1.3; }

  .back-row{
    display:flex; align-items:center; gap:8px; margin-bottom:14px; cursor:pointer;
    background:none; border:none; padding:0; color:inherit; font:inherit;
  }
  .back-row svg{ width:18px; height:18px; stroke: var(--muted); }
  .back-row span{ font-size:13.5px; font-weight:600; color: var(--muted); }

  .set-list{ display:flex; flex-direction:column; }
  .set-row{
    display:flex; align-items:center; gap:12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    cursor:pointer;
  }
  .set-row:last-child{ border-bottom:none; }
  .set-logo{
    width:52px; height:36px; object-fit:contain; flex-shrink:0;
  }
  .set-info{ flex:1; min-width:0; }
  .set-name{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .set-meta{ font-size:11px; color: var(--muted); margin-top:2px; }
  .set-progress-bar{
    height:4px; border-radius:3px; background: var(--surface-2); margin-top:6px; overflow:hidden;
  }
  .set-progress-bar .fill{ height:100%; background: var(--accent); }
  .set-count{
    font-family:'Space Grotesk', sans-serif; font-size:12.5px; font-weight:600; color: var(--muted); flex-shrink:0;
  }

  .set-header{
    display:flex; align-items:center; gap:12px; margin-bottom:12px;
  }
  .set-header img{ width:52px; height:36px; object-fit:contain; }
  .set-header .shname{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:16px; }
  .set-header .shcount{ font-size:12.5px; color: var(--muted); margin-top:2px; }

  .exp-filter-row{ display:flex; gap:8px; margin-bottom:14px; }

  .checklist-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .check-card{
    position:relative;
    border-radius:8px;
    overflow:hidden;
    background: var(--surface-2);
    border:1px solid var(--line);
    cursor:pointer;
    aspect-ratio: 63 / 88;
  }
  .check-card img{ width:100%; height:100%; object-fit:cover; display:block; }
  .check-card.unowned img{ filter: grayscale(1); opacity:0.4; }
  .check-card.owned{ box-shadow: 0 0 0 2px var(--accent) inset; }
  .check-card .cc-num{
    position:absolute; bottom:0; left:0; right:0;
    font-size:12px; text-align:center; font-weight:600;
    background: rgba(0,0,0,0.6); color:#fff; padding:3px 0;
  }
  .check-card .cc-qty{
    position:absolute; top:3px; right:3px;
    background: var(--accent); color: var(--accent-ink);
    font-size:9px; font-weight:700; border-radius:6px; padding:1px 4px;
  }
  .check-card .cc-minus{
    position:absolute; top:0; left:0;
    width:44px; height:44px; border-radius:0;
    background: transparent; color:#fff; border:none;
    display:flex; align-items:flex-start; justify-content:flex-start;
    cursor:pointer; padding:4px;
  }
  .check-card .cc-minus span{
    width:32px; height:32px; border-radius:50%;
    background: rgba(0,0,0,0.72);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; line-height:1; font-weight:700;
  }

  button.chip{ font-family:'Inter', sans-serif; }
  button.set-row{ width:100%; background:none; border:none; color:inherit; font:inherit; text-align:left; cursor:pointer; }
  .guide-panel{ margin-top:8px; }
  .scan-layout{ display:flex; flex-direction:column; gap:12px; }
  .hit{
    display:flex; flex-direction:column; gap:8px; align-items:stretch;
    padding:8px; border:1px solid var(--line); border-radius:10px; background:var(--surface);
  }
  .hit img{ width:100%; height:auto; aspect-ratio:63/88; object-fit:cover; border-radius:6px; }
  .hit .btn{ width:100%; min-height:44px; }
  .hit-qty{ font-weight:700; min-width:32px; text-align:center; }
  .result-list{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tool-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tool-row .btn{ width:auto; min-height:44px; }
  .collection-side{ display:none; }
  .account-shell{ max-width:560px; margin:0 auto; }
  .name-row{ display:block; }
  .account-actions .btn{ width:100%; }
  .empty .btn{ margin-top:16px; max-width:280px; }
  .zoom-btn{ width:44px; height:44px; }
  :focus{ outline:none; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (min-width: 360px){
    .checklist-grid{ grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 800px){
    #app, nav.tabs{ max-width:960px; }
    .scan-layout{ display:grid; grid-template-columns: minmax(0,1.15fr) minmax(280px, 0.85fr); gap:16px; align-items:start; }
    .collection-layout{ display:grid; grid-template-columns: minmax(0,1fr) 240px; gap:18px; align-items:start; }
    .collection-side{ display:block; position:sticky; top:12px; }
    .result-list{ display:flex; flex-direction:column; }
    .hit{ flex-direction:row; align-items:center; border:none; border-bottom:1px solid var(--line); border-radius:0; background:transparent; padding:10px 0; }
    .hit img{ width:54px; height:76px; aspect-ratio:auto; }
    .hit .btn{ width:auto; }
    .name-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .account-actions{ display:flex; justify-content:flex-end; }
    .account-actions .btn{ width:auto; min-width:180px; }

<body>
<div id="app">

  <header class="topbar">

  </header>

  <main id="main"></main>

  <nav class="tabs">
    <button data-tab="scan" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8V6a2 2 0 0 1 2-2h2M4 16v2a2 2 0 0 0 2 2h2M20 8V6a2 2 0 0 0-2-2h-2M20 16v2a2 2 0 0 1-2 2h-2"/><circle cx="12" cy="12" r="3.2"/></svg>
      Escanear
    </button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.8-3.8"/></svg>

    </button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.5h16M9.5 9.5V20"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="8" height="8" rx="1.5"/><rect x="12.5" y="4.5" width="8" height="8" rx="1.5"/><rect x="3.5" y="13.5" width="8" height="8" rx="1.5"/><rect x="12.5" y="13.5" width="8" height="8" rx="1.5"/></svg>

      Cuenta
    </button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="./config.js"></script>
<script>
/* ---------- estado ---------- */
const state = {
  tab: 'scan',
  collection: [],
  globalIndex: null, // catálogo completo de cartas cargado desde ./data/index.json
  scan: {
    mode: 'live', // 'live' | 'photo'
    liveActive: false,
    liveStatus: 'idle', // idle | starting | scanning | error
    suggestions: [],
    suggestionToken: 0,
    pendingConfirm: null,   // carta única de alta confianza esperando confirmación
    nameResults: [],         // resultados de búsqueda por nombre cuando número falla
    recent: [],
    cooldownGuess: '',
    cooldownUntil: 0,
    liveMessage: 'Preparando reconocimiento…',
    guideOpen: false,
    liveText: '',
    liveError: '',
    livePhase: 'idle', // idle | adjust | scanning
    zoom: 1,
    zoomMin: 1,
    zoomMax: 3,
    zoomStep: 0.1,
    hardwareZoom: false,
    roi: { x: 0.08, y: 0.08, w: 0.84, h: 0.82 },
    roiNum: { x: 0.55, y: 0.82, w: 0.32, h: 0.10 },
    roiDragging: false,
    roiNumDragging: false,
    photo: { image:null, status:'idle', guess:'', results:[], detail:'' }
  },
  search: { query:'', results:[], status:'idle' },
  collectionQuery: '',
  collectionError: false,
  account: {
    userId: '',
    firstName: '',
    lastName: '',
    email: '',
    code: '',
    pendingEmailId: '',
    touched: false,
    status: 'idle',
    message: '',
    redeemCode: '',
    redeemStatus: 'idle',
    redeemMessage: '',
    errorField: '',
  },
  sortMode: 'expansion', // 'expansion' | 'price-desc' | 'price-asc'
  expansion: {
    view: 'sets', // 'sets' | 'cards'
    sets: null,
    setsStatus: 'idle', // idle | loading | error
    setsError: '',
    selectedSet: null,
    cards: [],
    cardsStatus: 'idle', // idle | loading | error
    cardsError: '',
    cardsCache: {},
    filter: 'all', // 'all' | 'owned' | 'missing'
    query: ''
  }
};

/* El catálogo sale de ./data/. El álbum usa la API solo con sesión y config.js
   relleno. Si falta la clave, la URL de la API o el login, se queda en localStorage. */

const STORAGE_KEY = 'pokemon_album_collection_v1';
let authListenerReady = false;
let clerkFailed = false;
let userButtonMounted = false;
let accountAccess = { isAdmin: false, plan: null, maxCards: 0 };
let lastClientReport = 0;

function accountCacheKey(userId){
  return STORAGE_KEY + ':account:' + userId;
}

function currentUserId(){
  const user = window.Clerk && window.Clerk.user;
  return user && user.id ? String(user.id) : '';
}

function albumConfig(){
  const cfg = window.ALBUM_CONFIG || {};
  return {
    clerkPublishableKey: String(cfg.clerkPublishableKey || '').trim(),
    apiBase: String(cfg.apiBase || '').trim().replace(/\/$/, ''),
  };
}

function remoteAlbumEnabled(){
  const cfg = albumConfig();
  return Boolean(cfg.apiBase && cfg.clerkPublishableKey && window.Clerk && window.Clerk.user && window.Clerk.session);
}

function readStoredCollection(key){
  try{
    const raw = localStorage.getItem(key);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){
    console.error('No se pudo leer la colección guardada', e);
    return [];
  }
}

function writeStoredCollection(key, collection){
  localStorage.setItem(key, JSON.stringify(collection));
}

async function sessionToken(){
  const session = window.Clerk && window.Clerk.session;
  if(!session || typeof session.getToken !== 'function') return '';
  return (await session.getToken()) || '';
}

function clearAccountAccess(){
  accountAccess = { isAdmin: false, plan: null, maxCards: 0, planExpiresAt: '' };
  const link = document.getElementById('adminLink');
  if(link) link.remove();
}

function paintAdminLink(){
  const old = document.getElementById('adminLink');
  if(!accountAccess.isAdmin || !remoteAlbumEnabled()){
    if(old) old.remove();
    return;
  }
  const slot = document.getElementById('authSlot');
  if(!slot) return;
  const link = old || document.createElement('a');
  link.id = 'adminLink';
  link.className = 'admin-link';
  link.textContent = 'Administración';
  let href = 'admin/';
  try{
    const here = new URL(window.location.href);
    let path = here.pathname.endsWith('/') ? here.pathname : here.pathname + '/';
    here.pathname = path + 'admin/';
    here.search = '';
    here.hash = '';
    href = here.href;
    if(window.Clerk && typeof window.Clerk.buildUrlWithAuth === 'function'){
      href = window.Clerk.buildUrlWithAuth(href);
    }
  }catch(e){}
  link.href = href;
  if(!old) slot.appendChild(link);
}

function albumCardCount(list){
  return (list || []).reduce((total, card) => total + (Number(card && card.qty) || 0), 0);
}

function planLimit(){
  if(!remoteAlbumEnabled()) return 0;
  const max = Number(accountAccess.maxCards);
  return Number.isInteger(max) && max > 0 ? max : 0;
}

function fitsPlan(count){
  const max = planLimit();
  return !max || count <= max;
}

function planLimitMessage(){
  const name = accountAccess.plan && accountAccess.plan.name ? accountAccess.plan.name : 'actual';
  return `Tu plan ${name} permite guardar ${planLimit()} cartas.`;
}

function rememberAccount(data){
  const plan = data && data.plan ? data.plan : null;
  accountAccess = {
    isAdmin: Boolean(data && data.isAdmin),
    plan,
    maxCards: plan && Number.isInteger(plan.maxCards) ? plan.maxCards : 0,
    planExpiresAt: data && data.planExpiresAt ? String(data.planExpiresAt) : '',
  };
  paintAdminLink();
}

async function readApiError(res){
  try{
    const data = await res.json();
    if(data && data.error) return String(data.error);
  }catch(e){}
  return 'HTTP ' + res.status;
}

async function fetchRemoteAlbum(){
  const token = await sessionToken();
  if(!token) throw new Error('sin sesión');
  const res = await fetch(albumConfig().apiBase + '/api/collection', {
    headers: { Authorization: 'Bearer ' + token },
  });
  if(!res.ok) throw new Error(await readApiError(res));
  const data = await res.json();
  if(!data || !Array.isArray(data.cards)) throw new Error('respuesta inválida');
  rememberAccount(data);
  return data.cards;
}

async function putRemoteCards(collection){
  const token = await sessionToken();
  if(!token) throw new Error('sin sesión');
  const cards = collection
    .filter(card => card && card.id && card.qty > 0)
    .map(card => ({ cardId: String(card.id), qty: card.qty }));
  const res = await fetch(albumConfig().apiBase + '/api/collection', {
    method: 'PUT',
    headers: {
      Authorization: 'Bearer ' + token,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ cards }),
  });
  if(!res.ok) throw new Error(await readApiError(res));
}

async function hydrateRemoteCards(cards){
  const index = await ensureGlobalIndex();
  const byId = new Map(index.map(card => [card.id, card]));
  return cards.map(row => {
    const known = byId.get(row.cardId);
    const qty = row.qty || 1;
    if(known) return { ...known, qty };
    return {
      id: row.cardId,
      name: row.cardId,
      number: '',
      setId: '',
      setName: 'Fuera del catálogo',
      setTotal: 0,
      image: '',
      cardmarketEUR: null,
      tcgplayerUSD: null,
      qty,
    };
  });
}

async function loadCollection(){
  if(!remoteAlbumEnabled()){
    clearAccountAccess();
    state.collection = readStoredCollection(STORAGE_KEY);
    return;
  }
  const userId = currentUserId();
  try{
    const remote = await fetchRemoteAlbum();
    state.collection = await hydrateRemoteCards(remote);
    writeStoredCollection(accountCacheKey(userId), state.collection);
    state.collectionError = false;
  }catch(e){
    console.error('No se pudo leer el álbum de la cuenta', e);
    reportClientError(e, 'leer-album');
    state.collection = readStoredCollection(accountCacheKey(userId));
    state.collectionError = true;
    showToast('No se pudo leer tu cuenta. Muestro la última copia de esta cuenta.');
  }
}

async function saveCollection(){
  const signedIn = remoteAlbumEnabled();
  const key = signedIn ? accountCacheKey(currentUserId()) : STORAGE_KEY;
  try{
    writeStoredCollection(key, state.collection);
  }catch(e){
    console.error('No se pudo guardar la colección', e);
    showToast('No se pudo guardar (¿modo incógnito o almacenamiento lleno?)');
    reportClientError(e, 'guardar-local');
    if(!signedIn) return;
  }
  if(!signedIn) return;
  try{
    await putRemoteCards(state.collection);
  }catch(e){
    console.error('No se pudo guardar en la cuenta', e);
    reportClientError(e, 'guardar-album');
    showToast(e && e.message && e.message.indexOf('plan') !== -1
      ? e.message
      : 'No se pudo guardar en tu cuenta. Quedó solo la copia de esta cuenta.');
  }
}

function setAuthNote(text){
  const note = document.getElementById('authNote');
  if(note) note.textContent = text;
}

const PAGES_APP_URL = 'https://almuoluupv.github.io/EverPlayDeckTCG/';

function clerkReturnUrl(){
  try{
    const here = new URL(window.location.href);
    if(here.hostname === 'almuoluupv.github.io') return PAGES_APP_URL;
    return new URL('./', here).href;
  }catch{
    return PAGES_APP_URL;
  }
}

function clerkRedirectOptions(){
  const url = clerkReturnUrl();
  return {
    signInUrl: url,
    signUpUrl: url,
    signInForceRedirectUrl: url,
    signInFallbackRedirectUrl: url,
    signUpForceRedirectUrl: url,
    signUpFallbackRedirectUrl: url,
    afterSignOutUrl: url,
    afterMultiSessionSingleSignOutUrl: url,
  };
}

function devBrowserToken(original){
  try{
    const host = clerkHost(albumConfig().clerkPublishableKey);
    return new URL(original('https://' + host + '/')).searchParams.get('__clerk_db_jwt') || '';
  }catch{
    return '';
  }
}

function hashQuery(hash){
  const q = (hash || '').indexOf('?');
  if(q < 0) return new URLSearchParams();
  return new URLSearchParams(hash.slice(q + 1));
}

function isSsoReturn(url){
  const hash = url.hash || '';
  return hash.includes('sso-callback') || url.pathname.includes('/sso-callback');
}

function keepClerkDevBrowserOnReturn(clerk){
  if(!clerk || clerk.__albumDevBrowser || clerk.instanceType === 'production') return;
  if(typeof clerk.buildUrlWithAuth !== 'function') return;
  const original = clerk.buildUrlWithAuth.bind(clerk);
  clerk.buildUrlWithAuth = (value) => {
    let url;
    try{ url = new URL(original(value), window.location.href); }
    catch{ return original(value); }
    if(isSsoReturn(url)){
      const back = new URL(clerkReturnUrl());
      url.searchParams.forEach((v, k) => { if(!back.searchParams.has(k)) back.searchParams.set(k, v); });
      hashQuery(url.hash).forEach((v, k) => { if(!back.searchParams.has(k)) back.searchParams.set(k, v); });
      url = back;
    }
    if(url.origin === window.location.origin && !url.searchParams.has('__clerk_db_jwt')){
      const token = devBrowserToken(original);
      if(token) url.searchParams.set('__clerk_db_jwt', token);
    }
    return url.href;
  };
  clerk.__albumDevBrowser = true;
}

function prepareGoogleReturn(){
  const url = new URL(window.location.href);
  const hash = url.hash || '';
  if(!hash.includes('sso-callback') && !hash.includes('__clerk_status') && !hash.includes('__clerk_db_jwt')) return;
  hashQuery(hash).forEach((v, k) => { if(!url.searchParams.has(k)) url.searchParams.set(k, v); });
  url.hash = '';
  history.replaceState(null, '', url.href);
}

function googleTransferPending(clerk){
  const signIn = clerk.client && clerk.client.signIn;
  const signUp = clerk.client && clerk.client.signUp;
  const verification = signIn && signIn.firstFactorVerification;
  const external = signUp && signUp.verifications && signUp.verifications.externalAccount;
  const code = (verification && verification.error && verification.error.code)
    || (external && external.error && external.error.code)
    || '';
  const status = (verification && verification.status) || (external && external.status) || '';
  return status === 'transferable' || code === 'external_account_not_found' || code === 'sign_up_if_missing';
}

async function createGoogleUser(clerk){
  const signUp = clerk.client && clerk.client.signUp;
  if(!signUp || typeof signUp.create !== 'function' || !googleTransferPending(clerk)) return false;
  const created = await signUp.create({ transfer: true });
  if(created && created.status === 'complete' && created.createdSessionId){
    await clerk.setActive({ session: created.createdSessionId, redirectUrl: clerkReturnUrl() });
    return true;
  }
  if(created && created.status === 'missing_requirements' && typeof clerk.openSignIn === 'function'){
    clerk.openSignIn(signInModalOptions());
    setAuthNote('Falta un dato para crear la cuenta.');
    return true;
  }
  return false;
}

function stayOnAlbum(clerk, dest){
  let target;
  try{ target = new URL(dest, window.location.href); }
  catch{ return clerk.navigate(clerkReturnUrl()); }
  const onPages = target.hostname === 'almuoluupv.github.io';
  if(onPages && !target.pathname.startsWith('/EverPlayDeckTCG')) return clerk.navigate(clerkReturnUrl());
  const unfinished = /continue|factor|verify|sso-callback/i.test((target.hash || '') + target.pathname);
  if(unfinished && !clerk.user){
    if(typeof clerk.openSignIn === 'function') clerk.openSignIn(signInModalOptions());
    return;
  }
  const here = new URL(window.location.href);
  if(onPages && target.pathname === here.pathname && target.search === here.search) return;
  return clerk.navigate(dest);
}

async function finishGoogleReturn(){
  const params = new URLSearchParams(window.location.search);
  if(!params.get('__clerk_status') && !params.get('__clerk_created_session')) return;
  const clerk = window.Clerk;
  if(!clerk || typeof clerk.handleRedirectCallback !== 'function') return;
  const back = clerkReturnUrl();
  try{
    await clerk.handleRedirectCallback({
      ...clerkRedirectOptions(),
      transferable: true,
      signUpFallbackRedirectUrl: back,
      signInFallbackRedirectUrl: back,
      fallbackRedirectUrl: back,
    }, (dest) => stayOnAlbum(clerk, dest));
    if(!clerk.user) await createGoogleUser(clerk);
  }catch(e){
    try{
      if(await createGoogleUser(clerk)) return;
    }catch(transferError){
      console.error(transferError);
    }
    console.error(e);
    setAuthNote('No se pudo completar el acceso con Google. El álbum sigue en este dispositivo.');
    if(typeof clerk.openSignIn === 'function' && !clerk.user) clerk.openSignIn(signInModalOptions());
  }
}

function signInModalOptions(){
  const back = clerkRedirectOptions();
  return {
    withSignUp: true,
    transferable: true,
    oauthFlow: 'redirect',
    forceRedirectUrl: back.signInForceRedirectUrl,
    fallbackRedirectUrl: back.signInFallbackRedirectUrl,
    signInForceRedirectUrl: back.signInForceRedirectUrl,
    signInFallbackRedirectUrl: back.signInFallbackRedirectUrl,
    signUpForceRedirectUrl: back.signUpForceRedirectUrl,
    signUpFallbackRedirectUrl: back.signUpFallbackRedirectUrl,
  };
}

function onSignInClick(){
  const clerk = window.Clerk;
  if(clerk && clerk.loaded && typeof clerk.openSignIn === 'function' && !clerk.user){
    clerk.openSignIn(signInModalOptions());
    return;
  }
  if(clerkFailed || !albumConfig().clerkPublishableKey){
    setAuthNote('Login no disponible. Álbum en este dispositivo.');
    return;
  }
  setAuthNote('Preparando el acceso… El álbum sigue en este dispositivo.');
}

function clerkHost(publishableKey){
  const encoded = publishableKey.split('_')[2] || '';
  let decoded = '';
  try{ decoded = atob(encoded); }catch{ decoded = ''; }
  const host = decoded.replace(/\$+$/, '');
  if(!host.includes('.')) throw new Error('clave publicable inválida');
  return host;
}

function loadScript(src, attrs){
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.async = false;
    script.crossOrigin = 'anonymous';
    script.src = src;
    Object.entries(attrs || {}).forEach(([key, value]) => script.setAttribute(key, value));
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('No se pudo cargar Clerk'));
    document.head.appendChild(script);
  });
}

function paintAuthSlot(){
  const clerk = window.Clerk;
  const btn = document.getElementById('signInBtn');
  const userNode = document.getElementById('userButton');
  if(!clerk || !clerk.loaded || !clerk.user){
    if(btn) btn.hidden = false;
    if(userNode) userNode.hidden = true;
    if(clerk && clerk.loaded && !clerk.user) clearAccountAccess();
    if(!clerkFailed) setAuthNote('Álbum en este dispositivo');
    return;
  }
  if(btn) btn.hidden = true;
  if(userNode){
    userNode.hidden = false;
    if(!userButtonMounted && typeof clerk.mountUserButton === 'function'){
      clerk.mountUserButton(userNode);
      userButtonMounted = true;
    }
  }
  setAuthNote('Álbum de tu cuenta');
  paintAdminLink();
}

function activateClerk(){
  clerkFailed = false;
  if(typeof window.Clerk.addListener === 'function' && !window.Clerk.__albumListener){
    window.Clerk.__albumListener = true;
    window.Clerk.addListener(() => {
      paintAuthSlot();
      if(!authListenerReady) return;
      loadCollection().then(() => render());
    });
  }
  paintAuthSlot();
  authListenerReady = true;
}

async function loadClerk(){
  prepareGoogleReturn();
  const cfg = albumConfig();
  const host = clerkHost(cfg.clerkPublishableKey);
  await loadScript(`https://${host}/npm/@clerk/ui@1/dist/ui.browser.js`);
  await loadScript(`https://${host}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`, {
    'data-clerk-publishable-key': cfg.clerkPublishableKey,
  });
  if(typeof window.Clerk === 'function'){
    window.Clerk = new window.Clerk(cfg.clerkPublishableKey);
  }
  if(typeof window.__internal_ClerkUICtor !== 'function'){
    throw new Error('Clerk no cargó la interfaz');
  }
  if(!window.Clerk || typeof window.Clerk.load !== 'function'){
    throw new Error('Clerk no está listo');
  }
  await window.Clerk.load({
    ui: { ClerkUI: window.__internal_ClerkUICtor },
    ...clerkRedirectOptions(),
  });
  keepClerkDevBrowserOnReturn(window.Clerk);
  await finishGoogleReturn();
}

async function setupAuth(){
  const cfg = albumConfig();
  if(!cfg.clerkPublishableKey){
    clerkFailed = true;
    setAuthNote('Login no disponible. Álbum en este dispositivo.');
    return;
  }
  const loading = loadClerk();
  let timeoutId;
  const timeout = new Promise((_, reject) => {
    timeoutId = setTimeout(() => reject(new Error('Clerk tardó demasiado')), 8000);
  });
  try{
    await Promise.race([loading, timeout]);
    clearTimeout(timeoutId);
    activateClerk();
  }catch(e){
    console.error(e);
    clerkFailed = true;
    const btn = document.getElementById('signInBtn');
    if(btn) btn.hidden = false;
    setAuthNote('Login no disponible. Álbum en este dispositivo.');
    loading.then(() => {
      clearTimeout(timeoutId);
      activateClerk();
      loadCollection().then(() => render());
    }).catch(() => {});
  }
}

document.getElementById('signInBtn').addEventListener('click', onSignInClick);

function loadOptionalScript(src){
  return new Promise((resolve) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = () => resolve(true);
    script.onerror = () => resolve(false);
    document.head.appendChild(script);
  });
}

function exportCollection(){
  const blob = new Blob([JSON.stringify(state.collection, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `mi-album-pokemon-${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('Colección exportada');
}

function importCollection(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const imported = JSON.parse(ev.target.result);
      if(!Array.isArray(imported)) throw new Error('El archivo no tiene el formato esperado');
      let añadidas = 0, actualizadas = 0;
      let nextCount = albumCardCount(state.collection);
      for(const card of imported){
        if(!card || !card.id) continue;
        const qty = Math.max(1, Math.min(99, Number(card.qty) || 1));
        const existing = state.collection.find(c => c.id === card.id);
        if(existing) nextCount += Math.max(0, qty - existing.qty);
        else nextCount += qty;
      }
      if(!fitsPlan(nextCount)){
        showToast(planLimitMessage());
        return;
      }
      imported.forEach(card=>{
        if(!card || !card.id) return;
        const existing = state.collection.find(c => c.id === card.id);
        if(existing){
          existing.qty = Math.max(existing.qty, card.qty || 1);
          actualizadas++;
        }else{
          state.collection.push({ ...card, qty: card.qty || 1 });
          añadidas++;
        }
      });
      saveCollection();
      render();
      showToast(`Importadas ${añadidas} nuevas, ${actualizadas} actualizadas`);
    }catch(err){
      console.error(err);
      showToast('El archivo no es una colección válida');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/*
  Los datos viven junto a la app, en ./data/:
    data/sets.json          -> lista de expansiones
    data/cards/{setId}.json -> cartas de una expansión (para el casillero)
    data/index.json         -> TODAS las cartas juntas, para buscar y para
                                emparejar lo que detecta el escáner
  Los precios (eur/usd) son una foto fija del momento en que se generó el
  catálogo: no se actualizan solos, pero tampoco dependen de ninguna API en
  vivo, así que nunca fallan por red.
*/

function normalizeTcgdexAsset(url, kind='card', quality='low', extension='webp') {
  if (!url || typeof url !== 'string') return url || '';
  if (!url.includes('assets.tcgdex.net')) return url;
  const clean = url.split('?')[0];
  if (/\.(png|jpe?g|webp)$/i.test(clean)) return url;
  if (kind === 'symbol' || kind === 'logo') return clean + '/' + kind + '.' + extension;
  return clean + '/' + quality + '.' + extension;
}

function mapLocalCard(c){
  return {
    id: c.id,
    name: c.name,
    number: c.number,
    setId: c.setId,
    setName: c.setName,
    setTotal: c.setTotal,
    image: normalizeTcgdexAsset(c.image, 'card', 'low', 'webp'),
    cardmarketEUR: (typeof c.eur === 'number') ? c.eur : null,
    tcgplayerUSD: (typeof c.usd === 'number') ? c.usd : null
  };
}

let globalIndexPromise = null;
async function ensureGlobalIndex(){
  if(state.globalIndex) return state.globalIndex;
  if(!globalIndexPromise){
    globalIndexPromise = fetch('./data/index.json')
      .then(res=>{
        if(!res.ok) throw new Error(`No se pudo cargar el índice de cartas (HTTP ${res.status})`);
        return res.json();
      })
      .then(raw=>{
        state.globalIndex = raw.map(mapLocalCard);
        return state.globalIndex;
      });
  }
  return globalIndexPromise;
}

/* ── Sistema pHash ────────────────────────────────────────────────────────────
   Carga data/phash.json (generado por compute_hashes.js) y permite buscar
   la carta visualmente más parecida a un canvas capturado.

   Si phash.json no existe o está vacío, el sistema se desactiva graciosamente
   y la app sigue funcionando solo con OCR.
*/
let phashIndex = null;      // { "A1-001": "a3f2e1b4..." }
let phashPromise = null;

async function ensurePhash(){
  if(phashIndex !== null) return phashIndex;
  if(phashPromise) return phashPromise;
  phashPromise = fetch('./data/phash.json')
    .then(r => r.ok ? r.json() : {})
    .then(data => {
      phashIndex = data;
      const n = Object.keys(data).length;
      if(n > 0) console.log(`[pHash] Índice cargado: ${n} cartas`);
      else console.log('[pHash] Índice vacío — ejecuta compute_hashes.js para activarlo');
      return phashIndex;
    })
    .catch(() => { phashIndex = {}; return phashIndex; });
  return phashPromise;
}

/* DCT-II 1D sobre un Float64Array */
function dct1d(sig){
  const N=sig.length, out=new Float64Array(N), pi=Math.PI;
  for(let k=0;k<N;k++){
    let s=0;
    for(let n=0;n<N;n++) s+=sig[n]*Math.cos(pi*k*(2*n+1)/(2*N));
    out[k]=s;
  }
  return out;
}

/* DCT-II 2D separable (filas luego columnas) */
function dct2d(input, N){
  const tmp=new Float64Array(N*N), out=new Float64Array(N*N);
  for(let r=0;r<N;r++){const d=dct1d(input.slice(r*N,(r+1)*N));for(let c=0;c<N;c++) tmp[r*N+c]=d[c];}
  for(let c=0;c<N;c++){
    const col=new Float64Array(N);
    for(let r=0;r<N;r++) col[r]=tmp[r*N+c];
    const d=dct1d(col);
    for(let r=0;r<N;r++) out[r*N+c]=d[r];
  }
  return out;
}

/* El índice se calculó con sharp (Lanczos). Bajar a la mitad varias veces
   y solo al final a 32×32 acerca el hash del navegador a ese índice. */
function downscaleForPhash(canvas){
  let cur = canvas;
  while(cur.width > 64 || cur.height > 64){
    const nxt = document.createElement('canvas');
    nxt.width = Math.max(32, Math.round(cur.width / 2));
    nxt.height = Math.max(32, Math.round(cur.height / 2));
    const ctx = nxt.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(cur, 0, 0, nxt.width, nxt.height);
    cur = nxt;
  }
  const tmp = document.createElement('canvas');
  tmp.width = 32; tmp.height = 32;
  const tctx = tmp.getContext('2d', { willReadFrequently: true });
  tctx.imageSmoothingEnabled = true;
  tctx.imageSmoothingQuality = 'high';
  tctx.drawImage(cur, 0, 0, 32, 32);
  return tctx.getImageData(0, 0, 32, 32);
}

/* Recorta el margen negro de la mesa alrededor de la carta. No toca el
   recuadro del número: solo la imagen que se compara con el catálogo. */
function measureCardContent(canvas, dark = 34){
  if(!canvas?.width || !canvas?.height) return null;
  const maxW = 160;
  const scale = Math.min(1, maxW / canvas.width);
  const w = Math.max(1, Math.round(canvas.width * scale));
  const h = Math.max(1, Math.round(canvas.height * scale));
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const ctx = tmp.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(canvas, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for(let y = 0; y < h; y++){
    for(let x = 0; x < w; x++){
      const i = (y * w + x) * 4;
      const luma = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
      if(luma <= dark) continue;
      if(x < minX) minX = x;
      if(y < minY) minY = y;
      if(x > maxX) maxX = x;
      if(y > maxY) maxY = y;
    }
  }
  if(maxX < 0) return null;
  const fw = (maxX - minX + 1) / w;
  const fh = (maxY - minY + 1) / h;
  if(fw < 0.35 || fh < 0.35) return null;
  if(fw > 0.96 && fh > 0.96) return null;
  const aspect = (fw * canvas.width) / (fh * canvas.height);
  if(aspect < 0.55 || aspect > 0.92) return null;
  return { x: minX / w, y: minY / h, w: fw, h: fh };
}

function cropCanvasFraction(canvas, frac){
  const sx = Math.max(0, Math.floor(frac.x * canvas.width));
  const sy = Math.max(0, Math.floor(frac.y * canvas.height));
  const sw = Math.max(1, Math.min(canvas.width - sx, Math.ceil(frac.w * canvas.width)));
  const sh = Math.max(1, Math.min(canvas.height - sy, Math.ceil(frac.h * canvas.height)));
  const out = document.createElement('canvas');
  out.width = sw; out.height = sh;
  out.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
  return out;
}

function cardCanvasForMatch(canvas){
  const frac = measureCardContent(canvas);
  return frac ? cropCanvasFraction(canvas, frac) : canvas;
}

function computePhashFromCanvas(canvas){
  const N=32, H=8;
  const px=downscaleForPhash(canvas).data;

  // Escala de grises perceptual
  const gray=new Float64Array(N*N);
  for(let i=0,p=0;i<px.length;i+=4,p++)
    gray[p]=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];

  const dct=dct2d(gray,N);

  // Bloque 8×8 superior-izquierdo
  const block=new Float64Array(H*H);
  for(let r=0;r<H;r++) for(let c=0;c<H;c++) block[r*H+c]=dct[r*N+c];

  // Mediana (sin DC)
  const nodc=Float64Array.from(block.slice(1)).sort();
  const mid=Math.floor(nodc.length/2);
  const median=nodc.length%2===0?(nodc[mid-1]+nodc[mid])/2:nodc[mid];

  // Binarizar → BigInt → hex
  let hash=0n;
  for(let i=0;i<64;i++) if(block[i]>median) hash|=(1n<<BigInt(63-i));
  return hash.toString(16).padStart(16,'0');
}

/** Distancia de Hamming entre dos hashes hex de 16 chars */
function hammingDistance(a, b){
  let x=BigInt('0x'+a)^BigInt('0x'+b), d=0;
  while(x){ d+=Number(x&1n); x>>=1n; }
  return d;
}

/**
 * Busca las N cartas visualmente más similares al canvas dado.
 * Devuelve array de { card, distance } ordenado de menor a mayor distancia.
 * Solo busca si hay al menos 100 hashes en el índice.
 *
 * @param {HTMLCanvasElement} canvas  Frame capturado (el ROI de carta completa)
 * @param {number} topN              Cuántos candidatos devolver (default 5)
 * @param {number} maxDist           Distancia máxima para incluir (default 25)
 */
let phashGroupsPromise = null;
async function phashGroups(){
  if(phashGroupsPromise) return phashGroupsPromise;
  phashGroupsPromise = (async () => {
    const index = await ensurePhash();
    const cards = await ensureGlobalIndex();
    const idToSet = new Map(cards.map(c => [c.id, c.setId]));
    const groups = new Map();
    for(const [id, hash] of Object.entries(index)){
      const setId = idToSet.get(id) || '';
      let list = groups.get(setId);
      if(!list){ list = []; groups.set(setId, list); }
      list.push([id, hash]);
    }
    return { index, groups };
  })();
  return phashGroupsPromise;
}

async function findByPhash(canvas, topN=5, maxDist=25, setId=''){
  const { index, groups } = await phashGroups();
  const nHashes = Object.keys(index).length;
  if(nHashes < 100) return [];

  const entries = setId ? (groups.get(setId) || []) : Object.entries(index);
  if(!entries.length) return [];

  const cards = await ensureGlobalIndex();
  const queryHash = computePhashFromCanvas(cardCanvasForMatch(canvas));
  const results = [];
  for(const [id, hash] of entries){
    const d = hammingDistance(queryHash, hash);
    if(d <= maxDist) results.push({ id, distance: d });
  }
  results.sort((a,b) => a.distance - b.distance);
  const cardMap = new Map(cards.map(c=>[c.id,c]));
  return results.slice(0, topN)
    .map(r => ({ card: cardMap.get(r.id), distance: r.distance }))
    .filter(r => r.card);
}



/* Búsqueda por nombre (pestaña Buscar y modo Foto individual) */
async function searchCards(name){
  const clean = name.trim().toLowerCase().replace(/[^a-z0-9àáâãäåæçèéêëìíîïðñòóôõöùúûüýþÿ\-' ]/g,'');
  if(!clean || clean.length < 2) return [];
  const index = await ensureGlobalIndex();
  const exact = [], starts = [], fuzzy = [];
  for(const c of index){
    const n = (c.name || '').toLowerCase();
    if(n === clean){ exact.push(c); continue; }
    if(n.startsWith(clean) || clean.startsWith(n.slice(0, Math.max(4, n.length-2)))){ starts.push(c); continue; }
    // Fuzzy: tolerar 1-2 caracteres de diferencia al inicio (OCR corta nombres)
    if(clean.length >= 4 && n.startsWith(clean.slice(0, Math.max(3, clean.length-2)))){ fuzzy.push(c); }
  }
  // Deduplicar y limitar
  const seen = new Set();
  const out = [];
  for(const c of [...exact, ...starts, ...fuzzy]){
    if(!seen.has(c.id)){ seen.add(c.id); out.push(c); }
    if(out.length >= 12) break;
  }
  return out;
}

/* ---------- emparejado por número/total (el "054/198" de la esquina) ---------- */
/* Es mucho más fiable que leer el nombre: casi todas las cartas modernas
   imprimen abajo a la izquierda su número dentro de la expansión y el total
   de cartas de esa expansión, en un tipo de letra sencillo fácil de leer. */

/* Tabla de códigos impresos en la carta → setId del catálogo.
   Formato impreso: "TEF en 123/162"  →  setId: "sv05"
   El sufijo de idioma (en/es/fr/de/it/pt/ja/ko…) se ignora. */
const SET_CODE_MAP = {
  // Scarlet & Violet era
  'SVI':'sv01','PAL':'sv02','OBF':'sv03','MEW':'sv03.5',
  'PAR':'sv04','PAF':'sv04.5','TEF':'sv05','TWM':'sv06',
  'SFA':'sv06.5','SCR':'sv07','SSP':'sv08','PRE':'sv08.5',
  'JTA':'sv09',
  // Sword & Shield era
  'SSH':'swsh1','RCL':'swsh2','DAA':'swsh3','VIV':'swsh4',
  'SHF':'swsh4.5','BST':'swsh5','CRE':'swsh6','EVS':'swsh7',
  'FST':'swsh8','BRS':'swsh9','ASR':'swsh10','LOR':'swsh11',
  'SIT':'swsh12','CRZ':'swsh12.5','SIL':'swsh12.5gg',
  'PGO':'swshp','CEL':'cel25',
  // Sun & Moon era
  'SUM':'sm1','GRI':'sm2','BUS':'sm3','SLG':'sm3.5',
  'CIN':'sm4','UPR':'sm5','FLI':'sm6','CES':'sm7',
  'LOT':'sm8','TEU':'sm9','DRM':'sm9.5','UNM':'sm10',
  'UNB':'sm11','CEC':'sm12','HIF':'sm12.5','DET':'det1',
  // Black & White era (por si acaso)
  'BLW':'bw1','EPO':'bw2','NVI':'bw3','NXD':'bw4',
  'DEX':'bw5','DRX':'bw6','BCR':'bw7','PLS':'bw8',
  'PLF':'bw9','PLB':'bw10','LTR':'bw11',
  // Pocket
  'A1':'A1','A1A':'A1a','A2':'A2','A2A':'A2a','A2B':'A2b','A3':'A3',
};
const LANG_SUFFIXES = new Set(['EN','ES','FR','DE','IT','PT','JA','KO','ZH','TH','ID','RU','NL','PL']);

/* Dado el texto OCR del recuadro de número, extrae el código de set impreso.
   Ejemplos de entrada: "TEF en 123/162", "PAR es 054/182 ", "SV05en123/162"
   Devuelve el setId del catálogo o '' si no lo reconoce. */
function extractSetCode(text){
  const lines = String(text||'').toUpperCase().split(/[\n\r]+/);
  for(const line of lines){
    // Buscar token de 2-4 letras mayúsculas que sea un código conocido
    const tokens = line.split(/[\s\-_\/\.]+/);
    for(const tok of tokens){
      // Quitar sufijo de idioma: "TEFEN" → "TEF", "PARES" → "PAR"
      let code = tok.replace(/[^A-Z0-9]/g,'');
      if(code.length>2 && LANG_SUFFIXES.has(code.slice(-2))) code = code.slice(0,-2);
      if(code.length>2 && LANG_SUFFIXES.has(code.slice(-2))) code = code.slice(0,-2); // doble por si hay "SVIEN"
      if(SET_CODE_MAP[code]) return SET_CODE_MAP[code];
      // Pocket: A1, A2, etc
      if(/^[A-Z]\d[A-Z]?$/.test(code) && SET_CODE_MAP[code]) return SET_CODE_MAP[code];
    }
  }
  return '';
}

/* Busca cartas que coincidan en número, total Y setId.
   Si setId es '' cae al matching solo por número/total. */
async function matchByNumberAndSet(fractions, setId){
  if(!fractions.length) return [];
  const index = await ensureGlobalIndex();
  const results = [];
  const seen = new Set();
  for(const frac of fractions){
    for(const c of index){
      const n = parseInt((c.number||'').replace(/\D/g,''),10);
      if(n !== frac.number || c.setTotal !== frac.total) continue;
      if(setId && c.setId !== setId) continue; // filtro de set si lo tenemos
      if(!seen.has(c.id)){ seen.add(c.id); results.push(c); }
    }
  }
  // Si no encontró nada con el filtro de set, intentar sin él
  if(!results.length && setId){
    return matchByNumberAndSet(fractions, '');
  }
  return results;
}

function extractNumberFraction(text){
  // Correcciones OCR comunes en dígitos
  let t = String(text||'')
    .replace(/[Oo]/g,'0').replace(/[Il|¡]/g,'1').replace(/[Ss]/g,'5')
    .replace(/[Zz]/g,'2').replace(/[Bb]/g,'8').replace(/[Gg]/g,'6');

  const out=[]; const seen=new Set();
  const push=(num,tot)=>{
    num=parseInt(num,10); tot=parseInt(tot,10);
    if(isNaN(num)||isNaN(tot)||num<=0||tot<=0||num>tot||tot>999) return;
    const k=num+'/'+tot; if(!seen.has(k)){seen.add(k);out.push({number:num,total:tot});}
  };

  // Estrategia 1: NUM/TOTAL con barra — la más fiable
  for(const m of t.matchAll(/(\d{1,3})\s*\/\s*(\d{2,3})/g)) push(m[1],m[2]);

  // Estrategia 2: NUM TOTAL sin barra, con separador de espacio
  if(!out.length)
    for(const m of t.matchAll(/\b(\d{1,3})\s{1,3}(\d{2,3})\b/g)) push(m[1],m[2]);

  // Estrategia 3: extraer todos los números de 2-3 dígitos en orden
  // y probar combinaciones. Útil cuando el OCR parte "128/182" en "128 182"
  if(!out.length){
    const nums=[...t.matchAll(/\b(\d{2,3})\b/g)].map(m=>parseInt(m[1],10)).filter(n=>n>0&&n<1000);
    // probar pares consecutivos
    for(let i=0;i<nums.length-1;i++) push(nums[i],nums[i+1]);
  }

  return out;
}

async function matchByNumberFraction(fractions){
  if(!fractions.length) return [];
  const index = await ensureGlobalIndex();
  const results = [];
  for(const frac of fractions){
    for(const c of index){
      const n = parseInt((c.number || '').replace(/\D/g,''), 10);
      if(n === frac.number && c.setTotal === frac.total){
        results.push(c);
      }
    }
  }
  const seen = new Set();
  return results.filter(c => {
    if(seen.has(c.id)) return false;
    seen.add(c.id);
    return true;
  });
}

function naturalCardSort(a, b){
  const na = parseInt((a.number || '').replace(/\D/g, ''), 10);
  const nb = parseInt((b.number || '').replace(/\D/g, ''), 10);
  if(!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
  return (a.number || '').localeCompare(b.number || '');
}

function setOrderFor(setId, setName){
  if(!state.expansion.sets) return 0;
  const found = state.expansion.sets.find(s => s.id === setId || s.name === setName);

function ownedCountForSet(setId, setName){

}
