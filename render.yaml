# Blueprint de Render. No pongas secretos aquí: el panel pide los valores.
services:
  - type: web
    name: album-pokemon-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: PAGES_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
